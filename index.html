<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Literary Trio: Character · Setting · Summary Match (Hard Mode)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #121d22 0%, #1c2a2a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            font-family: 'Inter', system-ui, 'Segoe UI', 'Georgia', serif;
        }
        .quiz-pavilion {
            max-width: 1200px;
            width: 100%;
            background: #fef7ea;
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .tab-bar {
            display: flex;
            background: #2b3b2a;
            border-bottom: 2px solid #e6b422;
            flex-wrap: wrap;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 1rem 0.5rem;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            color: #ecd99b;
            background: #24382a;
            transition: 0.2s;
            letter-spacing: -0.2px;
            border-right: 1px solid #3e5a45;
        }
        .tab:last-child { border-right: none; }
        .tab.active {
            background: #fef7ea;
            color: #2c3e2b;
            border-bottom: 3px solid #e6b422;
            position: relative;
        }
        .quiz-container {
            padding: 2rem 2rem 1.5rem;
            min-height: 550px;
        }
        .progress-area {
            background: #e4dbc6;
            border-radius: 30px;
            height: 8px;
            margin-bottom: 1.8rem;
            overflow: hidden;
        }
        .progress-fill {
            background: #e6b422;
            width: 0%;
            height: 100%;
            transition: width 0.2s ease;
        }
        .q-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-weight: 600;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .q-count {
            background: #d9cdae;
            padding: 0.2rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
        }
        .challenge-card {
            background: #f7f0e0;
            border-radius: 2rem;
            padding: 1.6rem;
            margin-bottom: 1.8rem;
            border: 1px solid #e6d9bc;
            box-shadow: 0 8px 16px rgba(0,0,0,0.05);
        }
        .prompt-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: #b67e2e;
            margin-bottom: 0.5rem;
        }
        .prompt-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2f3e2c;
            border-left: 5px solid #e6b422;
            padding-left: 1rem;
            line-height: 1.3;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin: 1.5rem 0 1rem;
        }
        .opt-btn {
            background: white;
            border: 2px solid #ddd0ae;
            border-radius: 60px;
            padding: 0.8rem 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #2b3b28;
            font-size: 0.95rem;
        }
        .opt-btn:hover:not(.disabled-opt) {
            background: #fff2e0;
            border-color: #c49a2b;
            transform: scale(0.98);
        }
        .disabled-opt { pointer-events: none; opacity: 0.8; }
        .correct-highlight { background: #c9efd4 !important; border-color: #2b7a3e !important; }
        .wrong-highlight { background: #ffe1da !important; border-color: #bc3f26 !important; text-decoration: line-through; }
        .feedback {
            margin: 1rem 0 0.5rem;
            padding: 0.9rem 1.2rem;
            border-radius: 1.5rem;
            font-weight: 500;
            background: #ece2cf;
        }
        .feedback-correct { background: #e0f2e4; border-left: 8px solid #2e7d32; }
        .feedback-wrong { background: #ffe7e2; border-left: 8px solid #c23b22; }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .next-btn {
            background: #2c3e2f;
            border: none;
            padding: 0.7rem 2rem;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .next-btn:hover { background: #1e2e21; transform: scale(0.97); }
        .reset-btn { background: #735e3a; padding: 0.5rem 1.3rem; font-size: 0.8rem; margin-left: 0.5rem; }
        .footer-stats {
            background: #e2d5ba;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            border-top: 1px solid #cebf9b;
            color: #2d3e28;
            font-size: 0.85rem;
        }
        @media (max-width: 650px) {
            .quiz-container { padding: 1.5rem; }
            .prompt-text { font-size: 1.2rem; }
            .tab { font-size: 0.8rem; padding: 0.8rem 0.2rem; }
        }
    </style>
</head>
<body>
<div class="quiz-pavilion" id="masterPavilion">
    <div class="tab-bar">
        <div class="tab" data-mode="character">🎭 CHARACTER → STORY (hard)</div>
        <div class="tab" data-mode="setting">🌍 SETTING → STORY (hard)</div>
        <div class="tab" data-mode="summary">📜 SUMMARY → STORY (hard)</div>
    </div>
    <div id="quizRenderZone"></div>
</div>

<script>
    // ----- ALL 11 STORIES (full list) -----
    const ALL_STORIES = [
        "The Man to Send Rain Clouds",
        "If I Forget Thee, O Earth",
        "The Gift of the Magi",
        "The Scarlet Ibis",
        "The Necklace",
        "The Secret Life of Walter Mitty",
        "Romeo and Juliet",
        "Sympathy",
        "Casey at the Bat",
        "The Raven",
        "The Charge of the Light Brigade"
    ];

    // ----- 1. CHARACTER data (harder: ambiguous clues, secondary characters) -----
    const CHARACTER_DATA = [
        { prompt: "Leon & the priest who sprinkles holy water on a dead man's face (Pueblo tradition)", story: "The Man to Send Rain Clouds" },
        { prompt: "The boy named Marvin who sees the glowing radioactive remains of Earth from a moon colony", story: "If I Forget Thee, O Earth" },
        { prompt: "The couple who sell watch and hair to buy each other useless perfect gifts", story: "The Gift of the Magi" },
        { prompt: "The older brother who pushes his physically disabled brother until a scarlet bird dies tragically", story: "The Scarlet Ibis" },
        { prompt: "Mathilde Loisel, who borrows a diamond necklace and loses it, ruining her life", story: "The Necklace" },
        { prompt: "Daydreaming commander, surgeon, and accused assassin — all in his fantasies", story: "The Secret Life of Walter Mitty" },
        { prompt: "Friar Laurence and the star-crossed pair who die in a Verona tomb", story: "Romeo and Juliet" },
        { prompt: "The caged bird who beats its wings against the bars — speaker of a famous Dunbar poem", story: "Sympathy" },
        { prompt: "The mighty slugger from Mudville who strikes out in the final inning", story: "Casey at the Bat" },
        { prompt: "The grieving scholar haunted by a talking raven; lost Lenore", story: "The Raven" },
        { prompt: "Noble six hundred charging into 'the Valley of Death' despite a blunder", story: "The Charge of the Light Brigade" }
    ];

    // ----- 2. SETTING data (harder: abstract / precise locations) -----
    const SETTING_DATA = [
        { prompt: "A small Pueblo community in New Mexico, near a canyon, with traditional funeral rites involving feathers and a cottonwood tree", story: "The Man to Send Rain Clouds" },
        { prompt: "A sheltered colony on the Moon (Alphonsus crater) overlooking a desolate, radioactive Earth after nuclear war", story: "If I Forget Thee, O Earth" },
        { prompt: "A modest, cheap flat in New York City; the couple owns only two valuable things: a watch and long hair", story: "The Gift of the Magi" },
        { prompt: "A rural Southern farm with a bleeding tree, a cotton field, and a swamp; summer heat and a coming storm", story: "The Scarlet Ibis" },
        { prompt: "Paris, late 19th century: a Ministry, a ballroom, and later a shabby apartment in the Rue des Martyrs", story: "The Necklace" },
        { prompt: "A mundane drive through Waterbury, Connecticut; fantasy settings include a Navy hydroplane and a courtroom", story: "The Secret Life of Walter Mitty" },
        { prompt: "Verona, Italy: the Capulet orchard, a tomb, and the streets where sword fights break out between Montagues and Capulets", story: "Romeo and Juliet" },
        { prompt: "A metaphorical cage; the poem describes a bird's confinement and longing for freedom (no specific geographic location)", story: "Sympathy" },
        { prompt: "Mudville baseball stadium, the final inning, two outs, crowd full of despair — and one mighty batter", story: "Casey at the Bat" },
        { prompt: "A bleak, midnight chamber with a bust of Pallas and a violet curtain; a tapping at the door", story: "The Raven" },
        { prompt: "The Valley of Death (Balaklava during the Crimean War), surrounded by cannons and Russian artillery", story: "The Charge of the Light Brigade" }
    ];

    // ----- 3. SUMMARY data (dense, tricky, plot + tone) -----
    const SUMMARY_DATA = [
        { prompt: "An old shepherd dies during a sheep roundup; his family arranges a traditional burial blending Catholic rites with indigenous customs, using a feather and sprinkled holy water to send rain clouds.", story: "The Man to Send Rain Clouds" },
        { prompt: "In a future lunar colony, a boy named Marvin witnesses the destroyed Earth from afar; his father explains why they cannot return, revealing humanity's downfall.", story: "If I Forget Thee, O Earth" },
        { prompt: "A poor married couple secretly sells their most prized possessions — hair and a watch — to buy gifts for each other, only to find the gifts are now useless yet priceless.", story: "The Gift of the Magi" },
        { prompt: "A prideful older brother pushes his frail younger brother, Doodle, to learn physical skills; after a storm, Doodle dies under a bleeding tree, mirroring a fallen scarlet ibis.", story: "The Scarlet Ibis" },
        { prompt: "A beautiful but discontented woman borrows a diamond necklace for a ball, loses it, and spends ten years in poverty replacing it, only to learn the original was fake.", story: "The Necklace" },
        { prompt: "A mild-mannered man escapes mundane errands into heroic daydreams: pilot, surgeon, sharpshooter — until reality interrupts with a parking lot and a wife's reminder.", story: "The Secret Life of Walter Mitty" },
        { prompt: "Two teenagers from feuding families fall in love, marry secretly, and after a series of misunderstandings, both commit suicide, ending the ancient grudge.", story: "Romeo and Juliet" },
        { prompt: "The speaker observes a caged bird beating its wings and singing of freedom, drawing a parallel to the oppression and longing of African Americans.", story: "Sympathy" },
        { prompt: "The Mudville baseball team is losing 4–2; when Casey comes to bat, the crowd has total faith — but he strikes out on a vicious curveball, stunning everyone.", story: "Casey at the Bat" },
        { prompt: "A grieving scholar is visited by a mysterious raven that perches on a bust of Pallas; the bird only replies 'Nevermore,' driving the narrator into despair over lost Lenore.", story: "The Raven" },
        { prompt: "Six hundred British cavalrymen charge into a deadly valley due to a mistaken order; they face cannon fire on all sides, yet show tremendous courage and sacrifice.", story: "The Charge of the Light Brigade" }
    ];

    let currentMode = "character";   // 'character', 'setting', 'summary'
    let currentIndex = 0;
    let userAnswers = [];      // will be reinitialized per mode
    let quizFinished = false;
    let questionOrder = [];
    let optionPools = [];       // shuffled story lists per question

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function getDataSet() {
        if (currentMode === "character") return CHARACTER_DATA;
        if (currentMode === "setting") return SETTING_DATA;
        return SUMMARY_DATA;
    }

    function initMode() {
        const dataSet = getDataSet();
        const total = dataSet.length;
        questionOrder = [...Array(total).keys()];
        shuffleArray(questionOrder);
        optionPools = [];
        for (let i = 0; i < total; i++) {
            let shuffledStories = [...ALL_STORIES];
            shuffleArray(shuffledStories);
            optionPools.push(shuffledStories);
        }
        userAnswers = new Array(total).fill(null);
        currentIndex = 0;
        quizFinished = false;
    }

    function getCurrentRealIdx() {
        return questionOrder[currentIndex];
    }

    function saveAnswer(selectedStory) {
        if (quizFinished) return;
        const realIdx = getCurrentRealIdx();
        if (userAnswers[realIdx] !== null) return;
        userAnswers[realIdx] = selectedStory;
        renderCurrent();
    }

    function goToNext() {
        if (quizFinished) return;
        const realIdx = getCurrentRealIdx();
        if (userAnswers[realIdx] === null) {
            alert("⚠️ You must select a story before moving to the next challenge.");
            return;
        }
        const dataSet = getDataSet();
        if (currentIndex + 1 < questionOrder.length) {
            currentIndex++;
            renderCurrent();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        quizFinished = true;
        const dataSet = getDataSet();
        let score = 0;
        for (let i = 0; i < dataSet.length; i++) {
            if (userAnswers[i] === dataSet[i].story) score++;
        }
        const total = dataSet.length;
        const percent = Math.round((score / total) * 100);
        let modeLabel = currentMode === "character" ? "CHARACTER MATCH" : (currentMode === "setting" ? "SETTING MATCH" : "SUMMARY MATCH");
        let rating = percent >= 80 ? "🎓 LITERARY DETECTIVE" : (percent >= 60 ? "📚 SCHOLAR" : "⚔️ NEEDS REVIEW");
        const resultHtml = `
            <div class="quiz-container">
                <div class="progress-area"><div class="progress-fill" style="width:100%"></div></div>
                <div style="background:#e9dfc6; border-radius: 2rem; padding: 2rem; text-align: center;">
                    <h2 style="font-size:2rem;">${score} / ${total}</h2>
                    <p style="font-size:1.2rem;">${modeLabel} — Accuracy: ${percent}% — ${rating}</p>
                    <p style="margin-top:0.8rem;">✨ Stories: The Man to Send Rain Clouds · If I Forget Thee, O Earth · Gift of the Magi · The Scarlet Ibis · The Necklace · Walter Mitty · Romeo and Juliet · Sympathy · Casey at the Bat · The Raven · Charge of the Light Brigade ✨</p>
                    <button class="next-btn reset-btn" id="resetModeQuiz" style="background:#5e4a2e; margin-top:1.5rem;">⟳ RESTART (${modeLabel})</button>
                </div>
            </div>
            <div class="footer-stats">🏆 Hard mode: obscure clues | literary precision</div>
        `;
        const renderZone = document.getElementById("quizRenderZone");
        renderZone.innerHTML = resultHtml;
        document.getElementById("resetModeQuiz")?.addEventListener("click", () => {
            initMode();
            renderCurrent();
        });
    }

    function renderCurrent() {
        if (quizFinished) return;
        const realIdx = getCurrentRealIdx();
        const dataSet = getDataSet();
        const item = dataSet[realIdx];
        const selected = userAnswers[realIdx];
        const isAnswered = selected !== null;
        const correctStory = item.story;
        const isCorrect = isAnswered && (selected === correctStory);
        const currentOpts = optionPools[currentIndex];

        let feedbackHtml = "";
        if (isAnswered) {
            if (isCorrect) {
                feedbackHtml = `<div class="feedback feedback-correct">✅ Perfect match! “${correctStory}” is correct. 🔍 <em>${currentMode === 'character' ? 'Character clue' : (currentMode === 'setting' ? 'Setting detail' : 'Summary hint')}</em> verified.</div>`;
            } else {
                feedbackHtml = `<div class="feedback feedback-wrong">❌ Incorrect match. The correct story is <strong>${correctStory}</strong>. Re-examine the clue.</div>`;
            }
        } else {
            feedbackHtml = `<div class="feedback" style="background:#f2ecd9;">🎯 Select the story that matches the ${currentMode === 'character' ? 'character(s)' : (currentMode === 'setting' ? 'setting description' : 'plot summary')}.</div>`;
        }

        let optionsHtml = "";
        currentOpts.forEach(storyTitle => {
            let extraClass = "";
            let clickAttr = "";
            if (isAnswered) {
                extraClass = "disabled-opt";
                if (storyTitle === correctStory) extraClass += " correct-highlight";
                if (selected === storyTitle && storyTitle !== correctStory) extraClass += " wrong-highlight";
            } else {
                clickAttr = `onclick="saveAnswer('${storyTitle.replace(/'/g, "\\'")}')"`;
            }
            optionsHtml += `<div class="opt-btn ${extraClass}" ${clickAttr}>📖 ${storyTitle}</div>`;
        });

        const totalQ = questionOrder.length;
        const answeredCount = userAnswers.filter(v => v !== null).length;
        const progressPercent = ((currentIndex) / totalQ) * 100;
        let modeDisplay = currentMode === "character" ? "🎭 CHARACTER (hard clues)" : (currentMode === "setting" ? "🌍 SETTING (precise locations)" : "📜 SUMMARY (dense retelling)");

        const mainHtml = `
            <div class="quiz-container">
                <div class="progress-area"><div class="progress-fill" style="width: ${progressPercent}%"></div></div>
                <div class="q-meta">
                    <span class="q-count">🔖 ${currentIndex+1} / ${totalQ}</span>
                    <span style="background:#cfc29e; padding:0.2rem 1rem; border-radius:20px; font-size:0.7rem; font-weight:bold;">${modeDisplay}</span>
                </div>
                <div class="challenge-card">
                    <div class="prompt-label">${currentMode === 'character' ? 'CHARACTER / PERSONA' : (currentMode === 'setting' ? 'SETTING & ATMOSPHERE' : 'STORY SUMMARY')}</div>
                    <div class="prompt-text">“${item.prompt}”</div>
                </div>
                <div class="options-grid" id="optsGrid">
                    ${optionsHtml}
                </div>
                ${feedbackHtml}
                <div class="actions">
                    <span style="background:#e3d7be; padding:0.2rem 1rem; border-radius:30px;">📌 matched: ${answeredCount}/${totalQ}</span>
                    <button class="next-btn" id="nextActionBtn">${currentIndex+1 === totalQ ? "🏁 FINISH QUIZ" : "NEXT →"}</button>
                    <button class="next-btn reset-btn" id="resetDuringQuiz">⟳ Restart (This Mode)</button>
                </div>
            </div>
            <div class="footer-stats">
                <span>📚 The Man to Send Rain Clouds · The Raven · Gift of the Magi · Casey · Walter Mitty · The Necklace</span>
                <span>✔️ ${answeredCount} matched</span>
            </div>
        `;
        const renderZone = document.getElementById("quizRenderZone");
        renderZone.innerHTML = mainHtml;
        document.getElementById("nextActionBtn")?.addEventListener("click", goToNext);
        document.getElementById("resetDuringQuiz")?.addEventListener("click", () => {
            initMode();
            renderCurrent();
        });
    }

    function switchMode(mode) {
        currentMode = mode;
        initMode();
        renderCurrent();
        // update tab active class
        document.querySelectorAll('.tab').forEach(tab => {
            if (tab.getAttribute('data-mode') === mode) tab.classList.add('active');
            else tab.classList.remove('active');
        });
    }

    // attach tab listeners
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', (e) => {
            const mode = tab.getAttribute('data-mode');
            if (mode === 'character') switchMode('character');
            else if (mode === 'setting') switchMode('setting');
            else if (mode === 'summary') switchMode('summary');
        });
    });

    // initialize with character mode (hard)
    switchMode('character');
</script>
</body>
</html>
