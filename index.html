<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HARD MODE | Disciples, Christ, Prophecy, Evolution, Worldviews</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', monospace;
        }
        body {
            background: linear-gradient(135deg, #1a2a1f 0%, #0f1a0e 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            max-width: 950px;
            width: 100%;
            background: #fef9ef;
            border-radius: 40px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            overflow: hidden;
            padding: 25px 30px 35px;
        }
        h1 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 6px;
            color: #1f3b1a;
            border-left: 8px solid #b1622c;
            padding-left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: #b1622c;
            color: white;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 30px;
            letter-spacing: 1px;
        }
        .sub {
            color: #5a4a2e;
            margin-bottom: 28px;
            border-bottom: 2px dashed #c9b68b;
            padding-bottom: 14px;
            font-weight: 500;
        }
        .question-card {
            background: #fffbf3;
            border-radius: 28px;
            padding: 18px 22px;
            margin-bottom: 24px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            border: 1px solid #e2d4bc;
            transition: 0.05s linear;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2c3e2f;
            margin-bottom: 18px;
            background: #e9e0cf;
            padding: 10px 18px;
            border-radius: 40px;
            display: inline-block;
            width: auto;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #cbbf9a;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            transition: 0.08s linear;
            font-weight: 500;
            color: #2b3b26;
        }
        .option-btn:hover {
            background: #efe3cf;
            border-color: #9b7a4b;
            transform: scale(0.99);
        }
        .correct-feedback {
            background: #cfe8cf;
            border-left: 8px solid #236b23;
            color: #1b461b;
            padding: 12px 18px;
            margin-top: 14px;
            border-radius: 24px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .wrong-feedback {
            background: #f4dbd6;
            border-left: 8px solid #c23d22;
            color: #781f0a;
            padding: 12px 18px;
            margin-top: 14px;
            border-radius: 24px;
            font-weight: 500;
        }
        .neutral-feedback {
            background: #f2efdf;
            color: #7a6233;
            padding: 8px 18px;
            margin-top: 12px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-style: italic;
        }
        .score-area {
            background: #1f3b1a;
            color: #faf0cf;
            padding: 16px 24px;
            border-radius: 60px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }
        button.reset-btn {
            background: #b67945;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 44px;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        button.reset-btn:hover {
            background: #925f34;
            transform: scale(0.98);
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #aa986b;
            margin-top: 28px;
        }
        hr {
            margin: 15px 0;
            border-color: #ddd0b0;
        }
        @media (max-width: 600px) {
            .quiz-container { padding: 18px; }
            .question-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizApp">
    <h1>⚡ HARD MODE ⚡ <span class="badge">EXPERT</span></h1>
    <div class="sub">Disciples • Life/Death of Jesus • Emmaus • Prophecies • Evolution • Cambrian • Creationism vs Humanism</div>
    
    <div id="questionsArea"></div>
    
    <div class="score-area" id="scoreDisplay">SCORE: 0 / 0</div>
    <button class="reset-btn" id="resetQuizBtn">⟳ RESTART QUIZ (HARD)</button>
    <footer>🔍 no hand-holding — tricky distractors, theology & science depth | click any answer, instant feedback</footer>
</div>

<script>
    // ----- HARDER QUESTIONS ------
    const questions = [
        { // 1 - disciples tricky
            text: "Which two disciples were on the road to Emmaus when the risen Jesus appeared to them? (Luke 24)",
            options: ["Peter and John", "Cleopas and another unnamed disciple", "James and Andrew", "Matthew and Thomas"],
            correct: "Cleopas and another unnamed disciple",
            hint: "Luke 24:18 — one named Cleopas, the other not named."
        },
        { // 2 - Jesus death detail
            text: "At the moment Jesus died on the cross, which three supernatural events occurred according to the Gospel of Matthew?",
            options: ["Darkness, earthquake, temple veil torn", "Thunder, fire from heaven, angelic choir", "The moon turned blood, stars fell, graves opened", "Darkness, resurrection of saints, veil torn"],
            correct: "Darkness, earthquake, temple veil torn",
            hint: "Matthew 27:51-52: veil torn, earthquake, rocks split. Also saints raised but the question asks 'three events' — darkness, earthquake, veil torn are the primary triad."
        },
        { // 3 - mark of a prophet (deeper)
            text: "According to Deuteronomy 18:20-22, the ultimate test for a prophet speaking in the LORD's name is:",
            options: ["Their moral lifestyle", "The sign or wonder comes to pass", "The prediction comes true AND they don't lead to other gods", "They must perform at least three miracles"],
            correct: "The prediction comes true AND they don't lead to other gods",
            hint: "Deut 13:1-5 + 18:22 — even if prediction happens, but they push idolatry → false prophet. The complete mark: fulfillment AND orthodoxy."
        },
        { // 4 - life of Jesus (obscure event)
            text: "In the Gospel of John, before raising Lazarus, Jesus said 'I am the resurrection and the life. Whoever believes in me, though he die, yet shall he live.' Martha responded with a specific christological confession. What did she say?",
            options: ["You are the Christ, the Son of God", "You are the Holy One of Israel", "Yes, Lord; I believe that you are the Christ, the Son of God, who is coming into the world", "My Lord and my God"],
            correct: "Yes, Lord; I believe that you are the Christ, the Son of God, who is coming into the world",
            hint: "John 11:25-27 — Martha's exact confession."
        },
        { // 5 - fulfilled prophecy (advanced)
            text: "Which specific prophecy about the Messiah's betrayal for 30 pieces of silver, and the potter's field, is cited in Matthew 27:9-10?",
            options: ["Isaiah 53", "Psalm 41", "Zechariah 11:12-13", "Jeremiah 19"],
            correct: "Zechariah 11:12-13",
            hint: "Matthew explicitly says 'then was fulfilled what was spoken by Jeremiah the prophet' but the content matches Zechariah 11; textual scholars note Jeremiah-Zechariah composite or Jeremiah scroll order. The correct prophetic origin is Zechariah 11:12-13."
        },
        { // 6 - darwin & cambrian (hard nuance)
            text: "One of the key challenges the Cambrian Explosion poses to strict Darwinian gradualism (as originally emphasized by Darwin himself in 'On the Origin of Species') is:",
            options: ["Lack of volcanic activity", "The sudden appearance of diverse animal phyla without clear transitional precursors in older layers", "Too many transitional fossils", "The complete absence of soft-bodied organisms"],
            correct: "The sudden appearance of diverse animal phyla without clear transitional precursors in older layers",
            hint: "Darwin acknowledged in Chapter 9 that the abrupt appearance of major groups in the Cambrian was a difficulty for his theory."
        },
        { // 7 - creationist vs humanist (worldview clash)
            text: "A young-earth creationist and a secular humanist would disagree most fundamentally about:",
            options: ["The age of the earth", "The mechanism of natural selection", "Whether morality is objective", "The ultimate source of reality and purpose (God vs. matter/chance)"],
            correct: "The ultimate source of reality and purpose (God vs. matter/chance)",
            hint: "While age & mechanism are disagreements, the root presupposition is the source of existence and meaning."
        },
        { // 8 - resurrection of Jesus (legal/critical)
            text: "Which early non-Christian source (ca. 52-112 AD) mentions Jesus' execution under Pontius Pilate AND the fact that his followers worshipped him as a god 'still to this day'?",
            options: ["Josephus (Antiquities 18.3.3)", "Tacitus (Annals 15.44)", "Pliny the Younger (Letters 10.96)", "Suetonius (Life of Claudius)"],
            correct: "Pliny the Younger (Letters 10.96)",
            hint: "Pliny to Trajan: Christians sing to Christ as to a god. Tacitus mentions execution but not ongoing worship. Josephus has the Testimonium Flavianum (interpolated but mentions resurrection). Pliny confirms worship 'still to this day'."
        },
        { // 9 - disciples death tradition
            text: "According to early church tradition (Eusebius, Tertullian), which apostle was crucified upside-down in Rome because he felt unworthy to die the same way as Jesus?",
            options: ["Andrew", "Peter", "Philip", "Bartholomew"],
            correct: "Peter",
            hint: "Acts of Peter, Origen quoted by Eusebius: Peter crucified head downward."
        },
        { // 10 - Jesus' life (temple prophecy)
            text: "Jesus prophesied the destruction of the Jerusalem temple. What did He say would happen to 'not one stone upon another'?",
            options: ["It will be thrown down within one generation", "It will be burned by foreign armies", "It will be desecrated by the abomination of desolation", "Every stone will be toppled, not left standing"],
            correct: "Every stone will be toppled, not left standing",
            hint: "Mark 13:2: 'There will not be left here one stone upon another that will not be thrown down.' Fulfilled in AD 70."
        },
        { // 11 - cambrian & evolution (hard)
            text: "The 'Cambrian Explosion' is problematic for strict neo-Darwinian synthesis partly because:",
            options: ["Fossils appear in the 'wrong' order geologically", "The rate of morphological innovation required far exceeds observed rates of evolution", "DNA didn't exist yet", "It proves punctuated equilibrium wrong"],
            correct: "The rate of morphological innovation required far exceeds observed rates of evolution",
            hint: "Evolutionary biologists like Valentine & Erwin noted that to generate all body plans in 5-10 million years requires faster change than typically seen later."
        },
        { // 12 - humanism core tenet
            text: "The 1933 Humanist Manifesto I explicitly rejects which of the following?",
            options: ["Evolution", "Reason and science", "Traditional theistic supernaturalism", "Democracy"],
            correct: "Traditional theistic supernaturalism",
            hint: "Humanist Manifesto I: 'the universe is self-existing and not created' – rejects supernatural theism."
        },
        { // 13 - emmaus deeper
            text: "On the road to Emmaus, after Jesus explained the Scriptures, their hearts 'burned within them.' What specific Old Testament theme did Jesus likely emphasize?",
            options: ["The monarchy of David", "That the Messiah had to suffer and then enter glory", "The building of the tabernacle", "The Babylonian exile"],
            correct: "That the Messiah had to suffer and then enter glory",
            hint: "Luke 24:26: 'Ought not the Christ to have suffered these things and to enter into His glory?'"
        },
        { // 14 - darwin himself
            text: "In the first edition of 'On the Origin of Species', Darwin did NOT use the phrase 'survival of the fittest' (that came later from Herbert Spencer). Which phrase did he originally use?",
            options: ["Struggle for existence", "Natural preservation", "Nature's selection", "Descent with modification"],
            correct: "Struggle for existence",
            hint: "Darwin wrote 'struggle for existence' as the driver; Spencer coined 'survival of the fittest' later."
        },
        { // 15 - creationist critique of cambrian
            text: "Young-Earth creationists often point to the Cambrian Explosion as evidence for:",
            options: ["The geologic column is completely inverted", "Life appears suddenly in a 'creation event' rather than slow gradual transformation from a single common ancestor", "All Cambrian fossils are modern animals", "Evolution requires millions of years but the Cambrian shows stasis"],
            correct: "Life appears suddenly in a 'creation event' rather than slow gradual transformation from a single common ancestor",
            hint: "Creationists like Stephen Meyer (intelligent design) argue the abrupt appearance fits a model of separate creative acts."
        }
    ];

    let answerStatus = new Array(questions.length).fill(null);
    let selectedAnswers = new Array(questions.length).fill(null);

    const questionsArea = document.getElementById("questionsArea");
    const scoreDisplay = document.getElementById("scoreDisplay");

    function updateScore() {
        let correctCount = 0;
        for (let i = 0; i < answerStatus.length; i++) {
            if (answerStatus[i] === true) correctCount++;
        }
        scoreDisplay.innerText = `SCORE: ${correctCount} / ${questions.length}`;
    }

    function renderQuestions() {
        let html = '';
        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            const status = answerStatus[i];
            let feedbackHtml = '';
            if (status === true) {
                feedbackHtml = `<div class="correct-feedback">✅ HARDCORE CORRECT! ${q.correct} is right.<br><span style="font-size:0.8rem;">💡 ${q.hint}</span></div>`;
            } else if (status === false) {
                feedbackHtml = `<div class="wrong-feedback">❌ WRONG. Correct answer: <strong>${q.correct}</strong><br><span style="font-size:0.8rem;">📖 ${q.hint}</span></div>`;
            } else {
                feedbackHtml = `<div class="neutral-feedback">⚡ Click an answer — only the sharp survive</div>`;
            }

            let optionsHtml = '';
            for (let opt of q.options) {
                optionsHtml += `<button class="option-btn" data-qidx="${i}" data-opt="${opt.replace(/"/g, '&quot;')}">${opt}</button>`;
            }

            html += `
                <div class="question-card">
                    <div class="question-text">❓ ${i+1}. ${q.text}</div>
                    <div class="options" id="options-${i}">
                        ${optionsHtml}
                    </div>
                    <div id="feedback-${i}">
                        ${feedbackHtml}
                    </div>
                </div>
            `;
        }
        questionsArea.innerHTML = html;

        for (let i = 0; i < questions.length; i++) {
            const btns = document.querySelectorAll(`.option-btn[data-qidx="${i}"]`);
            btns.forEach(btn => {
                btn.removeEventListener('click', clickHandler);
                btn.addEventListener('click', clickHandler);
            });
        }
    }

    function clickHandler(e) {
        const btn = e.currentTarget;
        const qidx = parseInt(btn.getAttribute('data-qidx'));
        const selected = btn.getAttribute('data-opt');
        const isCorrect = (selected === questions[qidx].correct);
        answerStatus[qidx] = isCorrect;
        selectedAnswers[qidx] = selected;
        renderQuestions();
        updateScore();
    }

    function resetQuiz() {
        answerStatus.fill(null);
        selectedAnswers.fill(null);
        renderQuestions();
        updateScore();
    }

    renderQuestions();
    updateScore();
    document.getElementById("resetQuizBtn").addEventListener("click", resetQuiz);
</script>
</body>
</html>
