<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Literary Terms: Definition Match (Hard Mode)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #0c1a24 0%, #142830 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            font-family: 'Inter', system-ui, 'Segoe UI', 'Georgia', serif;
        }

        .quiz-arena {
            max-width: 1100px;
            width: 100%;
            background: #fef7ec;
            background-image: radial-gradient(circle at 15% 30%, rgba(200, 160, 80, 0.04) 2%, transparent 2.5%);
            background-size: 32px 32px;
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.45), inset 0 1px 2px rgba(255, 255, 245, 0.3);
            overflow: hidden;
        }

        .quiz-header {
            background: #1e2f2c;
            padding: 1.5rem 2rem;
            border-bottom: 4px solid #e6b422;
            color: #fffbee;
        }

        .quiz-header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        .badge-hard {
            background: #b4652a;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fae67a;
        }

        .term-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1rem;
            font-size: 0.7rem;
            font-family: monospace;
        }

        .term-strip span {
            background: #2e4a3e;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .quiz-core {
            padding: 2rem 2rem 1.5rem;
        }

        .progress-bar {
            background: #e2d8c2;
            border-radius: 40px;
            height: 8px;
            margin-bottom: 1.8rem;
            overflow: hidden;
        }

        .progress-fill {
            background: #e6b422;
            width: 0%;
            height: 100%;
            border-radius: 40px;
            transition: width 0.2s ease;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .q-counter {
            background: #e3d7bf;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #2f412a;
        }

        .def-box {
            background: #f3efdf;
            border-radius: 2rem;
            padding: 1.6rem;
            margin-bottom: 2rem;
            border: 1px solid #e7dbbc;
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02), 0 6px 12px rgba(0,0,0,0.05);
        }

        .definition-text {
            font-size: 1.45rem;
            font-weight: 600;
            line-height: 1.4;
            color: #1f2e25;
            font-style: normal;
            border-left: 5px solid #e6b422;
            padding-left: 1.2rem;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.8rem 0 1.5rem;
        }

        .opt-btn {
            background: white;
            border: 2px solid #ddcfaa;
            border-radius: 60px;
            padding: 0.9rem 1.3rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: monospace;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: all 0.2s;
            color: #2b3927;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .opt-btn:hover:not(.disabled-opt) {
            background: #fff6e8;
            border-color: #c49a2b;
            transform: scale(0.99);
        }

        .disabled-opt {
            cursor: default;
            pointer-events: none;
            opacity: 0.85;
        }

        .correct-opt {
            background: #ccf0d6 !important;
            border-color: #2b7a3e !important;
            box-shadow: 0 0 0 1px #2b7a3e inset;
        }

        .wrong-opt {
            background: #ffe0d9 !important;
            border-color: #bc3f26 !important;
            text-decoration: line-through;
            text-decoration-thickness: 1.5px;
        }

        .feedback-panel {
            background: #ede3cf;
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            margin: 1rem 0 1rem;
            font-weight: 500;
        }

        .feedback-correct {
            background: #dff0e3;
            border-left: 8px solid #2e7d32;
            color: #1b4d2b;
        }

        .feedback-wrong {
            background: #fee9e4;
            border-left: 8px solid #bc3f26;
            color: #842e1a;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .next-button {
            background: #2c3e2f;
            border: none;
            padding: 0.8rem 2.2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .next-button:hover {
            background: #1f2e21;
            transform: scale(0.97);
        }

        .reset-sm {
            background: #785f3c;
            padding: 0.5rem 1.4rem;
            font-size: 0.85rem;
        }

        .score-footer {
            background: #e4d8be;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #2f402a;
            font-size: 0.85rem;
            border-top: 1px solid #d4c5a2;
        }

        @media (max-width: 650px) {
            .quiz-core { padding: 1.5rem; }
            .definition-text { font-size: 1.2rem; }
            .opt-btn { font-size: 0.85rem; padding: 0.7rem 1rem; }
        }
    </style>
</head>
<body>
<div class="quiz-arena" id="quizApp">
    <div class="quiz-header">
        <h1>📖 DEFINE & CONQUER <span class="badge-hard">⚡ definition → term</span></h1>
        <div class="term-strip">
            <span>protagonist</span> <span>antagonist</span> <span>blank verse</span> <span>iambic pentameter</span>
            <span>iamb</span> <span>aside</span> <span>monologue</span> <span>soliloquy</span> <span>dramatic foil</span>
            <span>dramatic irony</span> <span>tragedy</span> <span>theme</span> <span>dramatic tragedy</span>
            <span>tragic hero</span> <span>symbol</span> <span>narrative poem</span> <span>repetition</span>
            <span>refrain</span> <span>rhythm</span>
        </div>
    </div>
    <div id="quizDynamicContent"></div>
</div>

<script>
    // ----- HARD MODE: DEFINITION first, then pick correct literary term -----
    const questions = [
        { definition: "The main character in a story, often the central figure who drives the action and faces conflict.", correctTerm: "Protagonist", distractors: ["Antagonist", "Tragic hero", "Dramatic foil"] },
        { definition: "A character or force that actively opposes the main character, creating central conflict.", correctTerm: "Antagonist", distractors: ["Villain", "Foil", "Catalyst"] },
        { definition: "Unrhymed poetry written in iambic pentameter; commonly used in Shakespeare and Milton.", correctTerm: "Blank verse", distractors: ["Free verse", "Iambic trimeter", "Heroic couplet"] },
        { definition: "A metrical line consisting of five iambic feet (da-DUM repeated five times), the most common meter in English verse.", correctTerm: "Iambic pentameter", distractors: ["Trochaic pentameter", "Anapestic tetrameter", "Dactylic hexameter"] },
        { definition: "A metrical foot with an unstressed syllable followed by a stressed syllable (˘ ′).", correctTerm: "Iamb", distractors: ["Trochee", "Spondee", "Anapest"] },
        { definition: "A short remark or comment made by a character to the audience, unheard by other characters on stage.", correctTerm: "Aside", distractors: ["Soliloquy", "Monologue", "Choral interjection"] },
        { definition: "A long speech by one character addressing other characters on stage.", correctTerm: "Monologue", distractors: ["Soliloquy", "Dialogue", "Aside"] },
        { definition: "A speech delivered by a character alone on stage, revealing innermost thoughts and feelings to the audience.", correctTerm: "Soliloquy", distractors: ["Monologue", "Dramatic address", "Eulogy"] },
        { definition: "A character whose traits directly contrast with those of another character, highlighting specific qualities of the protagonist.", correctTerm: "Dramatic foil", distractors: ["Alter ego", "Antagonist", "Symbolic double"] },
        { definition: "A situation where the audience or reader knows something that a character does not, creating tension or irony.", correctTerm: "Dramatic irony", distractors: ["Situational irony", "Verbal irony", "Tragic flaw"] },
        { definition: "A genre of drama where the protagonist suffers a catastrophic downfall, often due to a fatal flaw or external forces, evoking pity and fear.", correctTerm: "Tragedy", distractors: ["Comedy", "Tragicomedy", "Melodrama"] },
        { definition: "The central, unifying idea or underlying message about life or human nature conveyed by a literary work.", correctTerm: "Theme", distractors: ["Motif", "Plot", "Symbolic meaning"] },
        { definition: "A serious play or literary work that depicts the ruin or extreme suffering of the main character (a subset of tragedy, often focusing on stage representation).", correctTerm: "Dramatic tragedy", distractors: ["Revenge tragedy", "Domestic tragedy", "Aristotelian tragedy"] },
        { definition: "A noble or virtuous character who experiences a downfall due to a tragic flaw (hamartia), fate, or both, evoking catharsis.", correctTerm: "Tragic hero", distractors: ["Byronic hero", "Fallen protagonist", "Anti-hero"] },
        { definition: "An object, person, or event that represents a larger abstract idea or concept within a literary work.", correctTerm: "Symbol", distractors: ["Allegory", "Metaphor", "Image"] },
        { definition: "A form of poetry that tells a story, complete with plot, characters, and setting (e.g., epics, ballads).", correctTerm: "Narrative poem", distractors: ["Lyric poem", "Ode", "Elegy"] },
        { definition: "The repeated use of a word, phrase, sound, or structure for rhetorical effect and emphasis.", correctTerm: "Repetition", distractors: ["Anaphora", "Refrain", "Epanalepsis"] },
        { definition: "A regularly recurring line, phrase, or stanza (like a chorus) in a poem or song.", correctTerm: "Refrain", distractors: ["Repetition", "Rhyme scheme", "Stanza break"] },
        { definition: "The pattern of stressed and unstressed syllables in a line of poetry, creating flow and cadence; broader than strict meter.", correctTerm: "Rhythm", distractors: ["Meter", "Prosody", "Cadence"] }
    ];

    // SHUFFLE OPTIONS for each question (distractors + correct term, random order)
    function buildShuffledOptions(q) {
        let opts = [q.correctTerm, ...q.distractors];
        for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        return opts;
    }

    // Precompute randomized options for each question (keep consistent across renders, but reset on restart)
    let randomizedOptions = [];

    function initRandomizedOptions() {
        randomizedOptions = questions.map(q => buildShuffledOptions(q));
    }

    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);   // stores the selected term string
    let quizFinished = false;

    const container = document.getElementById("quizDynamicContent");

    function saveAnswer(questionIdx, selectedTerm) {
        if (quizFinished) return;
        if (userAnswers[questionIdx] !== null) return; // already answered, keep locked
        userAnswers[questionIdx] = selectedTerm;
        renderCurrentQuestion();
    }

    function goToNext() {
        if (quizFinished) return;
        if (userAnswers[currentIndex] === null) {
            alert("⚠️ You must select a literary term that matches the definition before moving on.");
            return;
        }
        if (currentIndex + 1 < questions.length) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        quizFinished = true;
        let score = 0;
        for (let i = 0; i < questions.length; i++) {
            if (userAnswers[i] && userAnswers[i].toLowerCase() === questions[i].correctTerm.toLowerCase()) {
                score++;
            }
        }
        const percent = Math.round((score / questions.length) * 100);
        let verdict = percent >= 85 ? "🏅 LITERARY MASTER" : (percent >= 65 ? "📘 SCHOLAR" : "⚔️ NEEDS REVISION");
        let resultHtml = `
            <div class="quiz-core">
                <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
                <div style="background:#ece1cb; border-radius: 2rem; padding: 2rem; text-align: center;">
                    <h2 style="font-size:2rem; letter-spacing:-0.5px;">${score} / ${questions.length}</h2>
                    <p style="font-size:1.3rem; font-weight:600;">Accuracy: ${percent}% — ${verdict}</p>
                    <p style="margin-top:1rem; background:#dacdae; display:inline-block; padding:0.4rem 1.2rem; border-radius:40px;">✅ all terms: protagonist, aside, blank verse, iambic pentameter, soliloquy, dramatic foil, symbol, refrain, rhythm ...</p>
                    <div style="margin-top: 1.8rem;">
                        <button class="next-button reset-sm" id="fullResetBtn" style="background:#4f3a24;">⟳ RESTART QUIZ (DEFINITION MODE)</button>
                    </div>
                </div>
            </div>
            <div class="score-footer">🎯 hard mode: definition → literary term | mastery challenge</div>
        `;
        container.innerHTML = resultHtml;
        document.getElementById("fullResetBtn")?.addEventListener("click", () => resetQuiz());
    }

    function resetQuiz() {
        currentIndex = 0;
        userAnswers = new Array(questions.length).fill(null);
        quizFinished = false;
        initRandomizedOptions();   // reshuffle options for new attempt (harder!)
        renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
        if (quizFinished) return;
        const q = questions[currentIndex];
        const currentOptions = randomizedOptions[currentIndex];
        const selected = userAnswers[currentIndex];
        const isAnswered = selected !== null;
        const isCorrect = isAnswered && (selected.toLowerCase() === q.correctTerm.toLowerCase());

        let feedbackHtml = "";
        if (isAnswered) {
            if (isCorrect) {
                feedbackHtml = `<div class="feedback-panel feedback-correct">✅ CORRECT. "${q.correctTerm}" precisely matches the definition.</div>`;
            } else {
                feedbackHtml = `<div class="feedback-panel feedback-wrong">❌ INCORRECT. The definition belongs to <strong>${q.correctTerm}</strong>.<br><span style="font-size:0.85rem; display:inline-block; margin-top:0.4rem;">✏️ Review: ${q.definition}</span></div>`;
            }
        }

        let optionsHtml = "";
        currentOptions.forEach(optTerm => {
            let additionalClasses = "";
            let clickHandler = "";
            if (isAnswered) {
                additionalClasses = "disabled-opt";
                if (optTerm.toLowerCase() === q.correctTerm.toLowerCase()) {
                    additionalClasses += " correct-opt";
                }
                if (selected === optTerm && optTerm !== q.correctTerm) {
                    additionalClasses += " wrong-opt";
                }
                clickHandler = ""; // no click
            } else {
                clickHandler = `onclick="saveAnswer(${currentIndex}, '${optTerm.replace(/'/g, "\\'")}')"`;
            }
            optionsHtml += `<div class="opt-btn ${additionalClasses}" ${clickHandler}>📖 ${optTerm}</div>`;
        });

        const total = questions.length;
        const answeredCount = userAnswers.filter(v => v !== null).length;
        const progressPercent = ((currentIndex) / total) * 100;

        const mainHtml = `
            <div class="quiz-core">
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%"></div>
                </div>
                <div class="question-header">
                    <span class="q-counter">🔖 term ${currentIndex+1} of ${total}</span>
                    <span style="font-size:0.7rem; background:#d8cbad; padding:0.2rem 0.8rem; border-radius:30px;">match definition → term</span>
                </div>
                <div class="def-box">
                    <div class="definition-text">“${q.definition}”</div>
                </div>
                <div class="options-grid" id="optionsContainer">
                    ${optionsHtml}
                </div>
                ${feedbackHtml}
                <div class="action-bar">
                    <span style="background:#e9deca; padding:0.2rem 1rem; border-radius:40px;">📌 answered: ${answeredCount}/${total}</span>
                    <button class="next-button" id="nextBtnAction">${currentIndex+1 === total ? "🏁 SUBMIT QUIZ" : "NEXT →"}</button>
                </div>
                <div style="margin-top: 1rem; text-align: right;">
                    <button class="next-button reset-sm" id="resetMidQuiz" style="background:#755f3a;">⟳ Reset All</button>
                </div>
            </div>
            <div class="score-footer">
                <span>⚡ protagonist · aside · soliloquy · blank verse · tragic hero · dramatic irony · refrain</span>
                <span>🔍 ${answeredCount} definitions matched</span>
            </div>
        `;

        container.innerHTML = mainHtml;
        const nextBtn = document.getElementById("nextBtnAction");
        if (nextBtn) nextBtn.addEventListener("click", goToNext);
        const resetMid = document.getElementById("resetMidQuiz");
        if (resetMid) resetMid.addEventListener("click", () => resetQuiz());
    }

    // initial shuffle and render
    initRandomizedOptions();
    renderCurrentQuestion();
</script>
</body>
</html>
