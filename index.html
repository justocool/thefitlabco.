<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literary Terms Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Georgia', 'Times New Roman', serif;
        }
        body {
            background: linear-gradient(145deg, #1e2a3a 0%, #0f1a24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            margin: 0;
        }
        .quiz-container {
            max-width: 950px;
            width: 100%;
            background: #fef9e8;
            border-radius: 2rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.3);
            overflow: hidden;
            transition: all 0.2s;
        }
        .quiz-header {
            background: #2c3e2f;
            padding: 1.5rem 2rem;
            color: #f7eac5;
            border-bottom: 5px solid #e6b422;
        }
        .quiz-header h1 {
            margin: 0;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
            font-weight: 700;
        }
        .quiz-header p {
            margin: 0.5rem 0 0;
            opacity: 0.85;
            font-style: italic;
        }
        .quiz-card {
            padding: 2rem 2rem 1.5rem;
        }
        .question-text {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 1.8rem;
            color: #1e2f2c;
            border-left: 6px solid #e6b422;
            padding-left: 1rem;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin-bottom: 2rem;
        }
        .option {
            background: #ffffff;
            border: 2px solid #ddd2b0;
            border-radius: 60px;
            padding: 0.8rem 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
            font-weight: 500;
            color: #2c3a2b;
        }
        .option:hover {
            background: #fff3df;
            border-color: #c49a2b;
            transform: scale(0.99);
        }
        .option.disabled-opt {
            pointer-events: none;
            opacity: 0.7;
        }
        .correct-feedback {
            background: #ccf0d6;
            border-left: 10px solid #2b7a3e;
            padding: 0.8rem 1.2rem;
            border-radius: 30px;
            margin: 1rem 0;
            color: #1b4d2b;
            font-weight: bold;
        }
        .wrong-feedback {
            background: #ffe0db;
            border-left: 10px solid #c23b22;
            padding: 0.8rem 1.2rem;
            border-radius: 30px;
            margin: 1rem 0;
            color: #8b2c1a;
        }
        .next-btn {
            background: #2c3e2f;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .next-btn:hover {
            background: #1f2e21;
            transform: scale(0.98);
        }
        .score-area {
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
            background: #ece3d0;
            padding: 0.7rem 2rem;
            border-top: 1px solid #d8caa3;
            color: #2c3e2f;
        }
        .reset-btn {
            background: #b4652a;
            margin-left: 1rem;
            padding: 0.4rem 1.2rem;
            border-radius: 40px;
            font-size: 0.9rem;
            border: none;
            color: white;
            cursor: pointer;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        @media (max-width: 600px) {
            .quiz-card { padding: 1.5rem; }
            .question-text { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizRoot">
    <div class="quiz-header">
        <h1>📖 Literary Terms Challenge</h1>
        <p>protagonist · antagonist · blank verse · iambic pentameter · aside · monologue · soliloquy · dramatic foil · dramatic irony · tragedy · theme · dramatic tragedy · tragic hero · symbol · narrative poem · repetition · refrain · rhythm</p>
    </div>
    <div id="quizDynamic"></div>
</div>

<script>
    // ----- QUIZ DATA (all requested terms included) -----
    const questions = [
        { text: "Which term refers to the main character or leading figure in a story?", options: ["Antagonist", "Protagonist", "Tragic hero", "Dramatic foil"], correct: "Protagonist" },
        { text: "What do we call a character who actively opposes or conflicts with the protagonist?", options: ["Foil", "Antagonist", "Villain", "Narrator"], correct: "Antagonist" },
        { text: "Unrhymed poetry written in iambic pentameter is known as:", options: ["Free verse", "Blank verse", "Narrative poem", "Refrain"], correct: "Blank verse" },
        { text: "What metrical pattern consists of five iambic feet (da-DUM da-DUM da-DUM da-DUM da-DUM)?", options: ["Trochaic tetrameter", "Anapestic trimeter", "Iambic pentameter", "Dactylic hexameter"], correct: "Iambic pentameter" },
        { text: "A metrical foot with an unstressed syllable followed by a stressed syllable (da-DUM) is called an:", options: ["Trochee", "Spondee", "Anapest", "Iamb"], correct: "Iamb" },
        { text: "In drama, a short remark spoken by a character to the audience, unheard by other characters, is an:", options: ["Aside", "Monologue", "Soliloquy", "Dialogue"], correct: "Aside" },
        { text: "A long speech by one character addressing other characters on stage is a:", options: ["Soliloquy", "Monologue", "Aside", "Repetition"], correct: "Monologue" },
        { text: "A speech given by a character alone on stage, revealing inner thoughts, is a:", options: ["Monologue", "Soliloquy", "Dramatic irony", "Refrain"], correct: "Soliloquy" },
        { text: "What is a 'dramatic foil'?", options: ["A character whose traits contrast with another to highlight qualities", "A repeated line in a poem", "A type of tragic hero", "A symbolic object"], correct: "A character whose traits contrast with another to highlight qualities" },
        { text: "When the audience knows more than the characters, creating tension or humor, it’s called:", options: ["Tragedy", "Symbolism", "Dramatic irony", "Rhythm"], correct: "Dramatic irony" },
        { text: "A genre where the protagonist suffers a catastrophic downfall (often due to a flaw) is a:", options: ["Comedy", "Narrative poem", "Tragedy", "Dramatic foil"], correct: "Tragedy" },
        { text: "The central idea, message, or insight about life in a literary work is its:", options: ["Theme", "Plot", "Symbol", "Rhythm"], correct: "Theme" },
        { text: "What term describes a type of tragedy that focuses on serious, somber themes and an unhappy ending?", options: ["Dramatic tragedy", "Comic relief", "Satire", "Narrative poem"], correct: "Dramatic tragedy" },
        { text: "A character of noble stature with a fatal flaw (hamartia) leading to their downfall is a:", options: ["Symbol", "Protagonist only", "Tragic hero", "Antagonist"], correct: "Tragic hero" },
        { text: "An object, person, or event that represents a larger abstract idea is a:", options: ["Theme", "Symbol", "Refrain", "Iamb"], correct: "Symbol" },
        { text: "A poem that tells a story (with plot, characters) is called a:", options: ["Blank verse", "Narrative poem", "Soliloquy", "Lyric"], correct: "Narrative poem" },
        { text: "Repeating a word, phrase, or line for emphasis or effect is known as:", options: ["Refrain", "Repetition", "Rhythm", "Allusion"], correct: "Repetition" },
        { text: "A repeated line, phrase, or stanza (like a chorus) in a poem or song is a:", options: ["Refrain", "Monologue", "Symbol", "Iamb"], correct: "Refrain" },
        { text: "The pattern of stressed and unstressed syllables in a line of poetry is its:", options: ["Rhythm", "Meter specifically", "Rhythm (general term)", "Blank verse"], correct: "Rhythm" }
    ];

    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let quizFinished = false;

    const quizContainer = document.getElementById("quizDynamic");

    function saveAnswer(questionIdx, selectedAnswer) {
        if (quizFinished) return;
        userAnswers[questionIdx] = selectedAnswer;
        renderCurrentQuestion();   // re-render to show feedback immediately
    }

    function goToNext() {
        if (quizFinished) return;
        // check if current question has been answered
        if (userAnswers[currentIndex] === null) {
            alert("Please select an answer before moving to the next question.");
            return;
        }
        if (currentIndex + 1 < questions.length) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            // quiz completed
            quizFinished = true;
            renderResults();
        }
    }

    function renderResults() {
        let score = 0;
        for (let i = 0; i < questions.length; i++) {
            if (userAnswers[i] === questions[i].correct) score++;
        }
        const percent = Math.round((score / questions.length) * 100);
        let resultHtml = `
            <div class="quiz-card">
                <div class="question-text">🎉 Quiz Completed! 🎉</div>
                <div style="background:#e9e0cb; padding:1.5rem; border-radius:2rem; text-align:center;">
                    <p style="font-size:2rem; font-weight:bold; margin:0;">${score} / ${questions.length}</p>
                    <p style="font-size:1.2rem;">Score: ${percent}%</p>
                    <p style="margin-top:1rem;">✨ You’ve tested your knowledge on: protagonist, antagonist, blank verse, iambic pentameter, iamb, aside, monologue, soliloquy, dramatic foil, dramatic irony, tragedy, theme, dramatic tragedy, tragic hero, symbol, narrative poem, repetition, refrain, rhythm ✨</p>
                    <button class="next-btn reset-btn" id="resetQuizBtn" style="background:#2c3e2f; margin-top:1rem;">⟳ Take Quiz Again</button>
                </div>
            </div>
            <div class="score-area">🏆 Final result</div>
        `;
        quizContainer.innerHTML = resultHtml;
        document.getElementById("resetQuizBtn")?.addEventListener("click", () => resetQuiz());
    }

    function resetQuiz() {
        currentIndex = 0;
        userAnswers = new Array(questions.length).fill(null);
        quizFinished = false;
        renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
        if (quizFinished) return;
        const q = questions[currentIndex];
        const selected = userAnswers[currentIndex];
        const isAnswered = selected !== null;
        const isCorrect = isAnswered && (selected === q.correct);

        let feedbackHtml = "";
        if (isAnswered) {
            if (isCorrect) {
                feedbackHtml = `<div class="correct-feedback">✅ Correct! ${q.correct} is right.</div>`;
            } else {
                feedbackHtml = `<div class="wrong-feedback">❌ Oops! The correct answer is: ${q.correct}.<br> <span style="font-size:0.9rem;">Review: ${q.text}</span></div>`;
            }
        }

        let optionsHtml = "";
        q.options.forEach(opt => {
            let additionalClass = "";
            let styleMod = "";
            if (isAnswered) {
                additionalClass = "disabled-opt";
                if (opt === q.correct) {
                    styleMod = 'style="background:#cbe6d0; border-color:#2b7a3e;"';
                } else if (opt === selected && opt !== q.correct) {
                    styleMod = 'style="background:#ffdad2; border-color:#c23b22;"';
                } else {
                    styleMod = 'style="opacity:0.8;"';
                }
            }
            optionsHtml += `<div class="option ${additionalClass}" ${styleMod} onclick="${!isAnswered ? `saveAnswer(${currentIndex}, '${opt.replace(/'/g, "\\'")}')` : ''}">${opt}</div>`;
        });

        const total = questions.length;
        const progress = `${currentIndex+1} / ${total}`;

        const fullHtml = `
            <div class="quiz-card">
                <div class="question-text">${currentIndex+1}. ${q.text}</div>
                <div class="options" id="optionsArea">
                    ${optionsHtml}
                </div>
                ${feedbackHtml}
                <div class="footer">
                    <span style="font-weight:500;">📌 Progress: ${progress}</span>
                    <button class="next-btn" id="nextQuestionBtn">${currentIndex+1 === total ? "Finish Quiz" : "Next →"}</button>
                </div>
            </div>
            <div class="score-area">
                ✅ answered: ${userAnswers.filter(a => a !== null).length} / ${total}
                ${userAnswers.every(a => a !== null) && !quizFinished ? ' <button class="reset-btn" id="earlyResetBtn" style="background:#6f4f2e;">Reset</button>' : ''}
            </div>
        `;

        quizContainer.innerHTML = fullHtml;

        document.getElementById("nextQuestionBtn")?.addEventListener("click", goToNext);
        const earlyReset = document.getElementById("earlyResetBtn");
        if (earlyReset) earlyReset.addEventListener("click", () => resetQuiz());
    }

    // initial render
    renderCurrentQuestion();
</script>
</body>
</html>
