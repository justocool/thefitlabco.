<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HARD MODE | Disciples, Jesus, Prophecy, Evolution, Ellen G. White</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', monospace;
        }
        body {
            background: linear-gradient(135deg, #1a2a1f 0%, #0f1a0e 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            max-width: 950px;
            width: 100%;
            background: #fef9ef;
            border-radius: 40px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
            overflow: hidden;
            padding: 25px 30px 35px;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 6px;
            color: #1f3b1a;
            border-left: 8px solid #b1622c;
            padding-left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .badge {
            background: #b1622c;
            color: white;
            font-size: 0.8rem;
            padding: 5px 12px;
            border-radius: 30px;
            letter-spacing: 1px;
        }
        .sub {
            color: #5a4a2e;
            margin-bottom: 28px;
            border-bottom: 2px dashed #c9b68b;
            padding-bottom: 14px;
            font-weight: 500;
        }
        .question-card {
            background: #fffbf3;
            border-radius: 28px;
            padding: 18px 22px;
            margin-bottom: 24px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            border: 1px solid #e2d4bc;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2c3e2f;
            margin-bottom: 18px;
            background: #e9e0cf;
            padding: 10px 18px;
            border-radius: 40px;
            display: inline-block;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #cbbf9a;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 0.95rem;
            text-align: left;
            cursor: pointer;
            font-weight: 500;
            color: #2b3b26;
            transition: 0.08s linear;
        }
        .option-btn:hover {
            background: #efe3cf;
            border-color: #9b7a4b;
            transform: scale(0.99);
        }
        .correct-feedback {
            background: #cfe8cf;
            border-left: 8px solid #236b23;
            color: #1b461b;
            padding: 12px 18px;
            margin-top: 14px;
            border-radius: 24px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .wrong-feedback {
            background: #f4dbd6;
            border-left: 8px solid #c23d22;
            color: #781f0a;
            padding: 12px 18px;
            margin-top: 14px;
            border-radius: 24px;
            font-weight: 500;
        }
        .neutral-feedback {
            background: #f2efdf;
            color: #7a6233;
            padding: 8px 18px;
            margin-top: 12px;
            border-radius: 24px;
            font-size: 0.85rem;
            font-style: italic;
        }
        .score-area {
            background: #1f3b1a;
            color: #faf0cf;
            padding: 16px 24px;
            border-radius: 60px;
            text-align: center;
            font-size: 1.6rem;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 12px;
        }
        button.reset-btn {
            background: #b67945;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 44px;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        button.reset-btn:hover {
            background: #925f34;
            transform: scale(0.98);
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #aa986b;
            margin-top: 28px;
        }
        @media (max-width: 600px) {
            .quiz-container { padding: 18px; }
            .question-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizApp">
    <h1>⚡ HARD MODE ⚡ <span class="badge">+ ELLEN G. WHITE</span></h1>
    <div class="sub">Disciples • Life/Death of Jesus • Emmaus • Prophecies • Evolution • Cambrian • Creationism vs Humanism • Ellen G. White</div>
    
    <div id="questionsArea"></div>
    
    <div class="score-area" id="scoreDisplay">SCORE: 0 / 0</div>
    <button class="reset-btn" id="resetQuizBtn">⟳ RESTART QUIZ (HARD + EGW)</button>
    <footer>🔍 includes Seventh-day Adventist prophetess Ellen G. White — theology, history, and science worldview questions</footer>
</div>

<script>
    // ----- HARDER QUESTIONS + ELLEN G. WHITE ------
    const questions = [
        // 1 - Disciples (Emmaus)
        {
            text: "Which two disciples were on the road to Emmaus when the risen Jesus appeared to them? (Luke 24)",
            options: ["Peter and John", "Cleopas and another unnamed disciple", "James and Andrew", "Matthew and Thomas"],
            correct: "Cleopas and another unnamed disciple",
            hint: "Luke 24:18 — one named Cleopas, the other not named."
        },
        // 2 - Jesus death (Matthew)
        {
            text: "At the moment Jesus died on the cross, which three supernatural events occurred according to the Gospel of Matthew?",
            options: ["Darkness, earthquake, temple veil torn", "Thunder, fire from heaven, angelic choir", "The moon turned blood, stars fell, graves opened", "Darkness, resurrection of saints, veil torn"],
            correct: "Darkness, earthquake, temple veil torn",
            hint: "Matthew 27:51-52: veil torn, earthquake, rocks split. Darkness was from the 6th hour."
        },
        // 3 - Mark of a prophet (Deut)
        {
            text: "According to Deuteronomy 18:20-22, the ultimate test for a prophet speaking in the LORD's name is:",
            options: ["Their moral lifestyle", "The sign or wonder comes to pass", "The prediction comes true AND they don't lead to other gods", "They must perform at least three miracles"],
            correct: "The prediction comes true AND they don't lead to other gods",
            hint: "Deut 13:1-5 + 18:22 — even if prediction happens, but they push idolatry → false prophet."
        },
        // 4 - Ellen G. White: her role
        {
            text: "Ellen G. White (1827-1915) is most accurately described as:",
            options: ["The founder of the Seventh-day Adventist Church", "A prophetess whose writings are considered a continuing and authoritative source of truth alongside the Bible", "A New Testament apostle", "A Catholic mystic"],
            correct: "A prophetess whose writings are considered a continuing and authoritative source of truth alongside the Bible",
            hint: "Seventh-day Adventists believe she had the 'spirit of prophecy' (Rev 12:17; 19:10). She was not the founder (James White, Joseph Bates, etc.) but a prophetess."
        },
        // 5 - EGW and the Bible
        {
            text: "What did Ellen G. White teach about the relationship between her writings and the Bible?",
            options: ["Her writings replace the Bible", "The Bible is outdated; her writings are the new canon", "The Bible is the standard, and her writings are a 'lesser light' leading to the 'greater light'", "Only her writings are inspired, not the Bible"],
            correct: "The Bible is the standard, and her writings are a 'lesser light' leading to the 'greater light'",
            hint: "EGW wrote in 'Colporteur Ministry' p. 125: 'The Lord has seen fit to give me a lesser light to lead men and women to the greater light.'"
        },
        // 6 - EGW health message
        {
            text: "Ellen G. White's health reform writings (later part of Adventist health message) advocated for all of the following EXCEPT:",
            options: ["Vegetarianism", "Abstinence from alcohol and tobacco", "Regular exercise and sunlight", "Mandatory veganism for salvation"],
            correct: "Mandatory veganism for salvation",
            hint: "EGW promoted plant-based diet but did not make it a salvation issue. She wrote 'It is no sin to eat meat' (Counsels on Diet and Foods, p. 394) in certain circumstances."
        },
        // 7 - EGW and creation
        {
            text: "Regarding the creation account in Genesis, Ellen G. White taught:",
            options: ["Theistic evolution over millions of years", "Literal six-day, recent creation (young earth) with each day being a 24-hour evening/morning", "The days are symbolic ages", "Creation is just a myth"],
            correct: "Literal six-day, recent creation (young earth) with each day being a 24-hour evening/morning",
            hint: "Patriarchs and Prophets, p. 112: 'God took six days to create the earth... made in six literal days.' She rejected evolution."
        },
        // 8 - EGW and the Cambrian Explosion
        {
            text: "If Ellen G. White were asked about the Cambrian Explosion (sudden appearance of complex animal fossils), what would she most likely say based on her writings?",
            options: ["It proves evolution", "It matches the sudden creative acts of God during creation week", "It's a hoax", "It happened millions of years before Adam"],
            correct: "It matches the sudden creative acts of God during creation week",
            hint: "EGW described God calling forth life suddenly, not gradually. 'Spirit of Prophecy' vol. 1, p. 70: 'He spoke... and they were created.'"
        },
        // 9 - Prophecy about Jesus (Zechariah)
        {
            text: "Which specific prophecy about the Messiah's betrayal for 30 pieces of silver, and the potter's field, is cited in Matthew 27:9-10?",
            options: ["Isaiah 53", "Psalm 41", "Zechariah 11:12-13", "Jeremiah 19"],
            correct: "Zechariah 11:12-13",
            hint: "Matthew attributes to Jeremiah but content matches Zechariah 11:12-13."
        },
        // 10 - Darwin & Cambrian
        {
            text: "One of the key challenges the Cambrian Explosion poses to strict Darwinian gradualism is:",
            options: ["Lack of volcanic activity", "Sudden appearance of diverse animal phyla without clear transitional precursors", "Too many transitional fossils", "Absence of soft-bodied organisms"],
            correct: "Sudden appearance of diverse animal phyla without clear transitional precursors",
            hint: "Darwin acknowledged in Chapter 9 that abrupt appearance of major groups was a difficulty."
        },
        // 11 - EGW and evolution
        {
            text: "Ellen G. White explicitly rejected which of the following ideas in her writings?",
            options: ["Natural selection within species", "The geological column", "Evolution from simple to complex over millions of years (theistic or atheistic)", "Microevolution"],
            correct: "Evolution from simple to complex over millions of years (theistic or atheistic)",
            hint: "EGW wrote in 'Spirit of Prophecy' vol. 3, p. 178: 'The theory of evolution is one of the fables of which Peter speaks.'"
        },
        // 12 - EGW prophetic testing
        {
            text: "Which biblical test for a prophet would critics of Ellen G. White most commonly point to as problematic?",
            options: ["Deuteronomy 18:22 — some predictions appeared to fail (e.g., some people would live to see certain events)", "Deuteronomy 13 — she led people to other gods", "She never performed miracles", "She didn't speak in first-person 'Thus says the LORD'"],
            correct: "Deuteronomy 18:22 — some predictions appeared to fail (e.g., some people would live to see certain events)",
            hint: "Example: she predicted some living in 1856 would not die before certain end-time events. Critics say some died before fulfillment; defenders argue conditional prophecy or time statements."
        },
        // 13 - Martha's confession
        {
            text: "In John 11, before raising Lazarus, Martha said to Jesus:",
            options: ["You are the Christ, the Son of God", "You are the Holy One of Israel", "Yes, Lord; I believe that you are the Christ, the Son of God, who is coming into the world", "My Lord and my God"],
            correct: "Yes, Lord; I believe that you are the Christ, the Son of God, who is coming into the world",
            hint: "John 11:25-27 — exact wording."
        },
        // 14 - EGW great controversy theme
        {
            text: "The central theme of Ellen G. White's book 'The Great Controversy' is:",
            options: ["The conflict between science and religion", "The cosmic battle between Christ and Satan over God's character and law", "The Protestant Reformation only", "The history of the Roman Empire"],
            correct: "The cosmic battle between Christ and Satan over God's character and law",
            hint: "Preface to 'The Great Controversy' describes the conflict between good and evil from heaven to earth's final restoration."
        },
        // 15 - Humanism core tenet
        {
            text: "The 1933 Humanist Manifesto I explicitly rejects which of the following?",
            options: ["Evolution", "Reason and science", "Traditional theistic supernaturalism", "Democracy"],
            correct: "Traditional theistic supernaturalism",
            hint: "Humanist Manifesto I: 'the universe is self-existing and not created' – rejects supernatural theism."
        },
        // 16 - EGW and the sanctuary doctrine
        {
            text: "Ellen G. White supported the Seventh-day Adventist understanding that after 1844, Jesus began a new phase of ministry in heaven. What is that phase called?",
            options: ["The atonement", "The cleansing of the heavenly sanctuary (Investigative Judgment)", "The outpouring of the Holy Spirit", "The sealing of the 144,000"],
            correct: "The cleansing of the heavenly sanctuary (Investigative Judgment)",
            hint: "Based on Daniel 8:14 and the Day of Atonement typology. EGW in 'Early Writings' and 'The Great Controversy' affirms the Investigative Judgment."
        },
        // 17 - Road to Emmaus
        {
            text: "On the road to Emmaus, after Jesus explained the Scriptures, their hearts 'burned within them.' What specific Old Testament theme did Jesus likely emphasize?",
            options: ["The monarchy of David", "That the Messiah had to suffer and then enter glory", "The building of the tabernacle", "The Babylonian exile"],
            correct: "That the Messiah had to suffer and then enter glory",
            hint: "Luke 24:26: 'Ought not the Christ to have suffered these things and to enter into His glory?'"
        },
        // 18 - EGW and the Sabbath
        {
            text: "Ellen G. White taught that the seventh-day Sabbath (Saturday) would be a final test issue. According to her, the mark of the beast (Revelation 13) is ultimately about:",
            options: ["666", "Worshipping on Sunday instead of the biblical Sabbath", "A microchip", "The Pope's crown"],
            correct: "Worshipping on Sunday instead of the biblical Sabbath",
            hint: "'The Great Controversy,' chapter 25: the Sabbath vs. Sunday is the final conflict. The mark of the beast is enforced Sunday observance."
        },
        // 19 - Creationist vs Humanist root difference
        {
            text: "A young-earth creationist and a secular humanist would disagree most fundamentally about:",
            options: ["The age of the earth", "The mechanism of natural selection", "Whether morality is objective", "The ultimate source of reality and purpose (God vs. matter/chance)"],
            correct: "The ultimate source of reality and purpose (God vs. matter/chance)",
            hint: "While age & mechanism are disagreements, the root presupposition is the source of existence and meaning."
        },
        // 20 - Darwin's original phrase
        {
            text: "In the first edition of 'On the Origin of Species', Darwin did NOT use the phrase 'survival of the fittest'. Which phrase did he originally use?",
            options: ["Struggle for existence", "Natural preservation", "Nature's selection", "Descent with modification"],
            correct: "Struggle for existence",
            hint: "Darwin wrote 'struggle for existence' as the driver; Spencer coined 'survival of the fittest' later."
        }
    ];

    let answerStatus = new Array(questions.length).fill(null);
    let selectedAnswers = new Array(questions.length).fill(null);

    const questionsArea = document.getElementById("questionsArea");
    const scoreDisplay = document.getElementById("scoreDisplay");

    function updateScore() {
        let correctCount = 0;
        for (let i = 0; i < answerStatus.length; i++) {
            if (answerStatus[i] === true) correctCount++;
        }
        scoreDisplay.innerText = `SCORE: ${correctCount} / ${questions.length}`;
    }

    function renderQuestions() {
        let html = '';
        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            const status = answerStatus[i];
            let feedbackHtml = '';
            if (status === true) {
                feedbackHtml = `<div class="correct-feedback">✅ CORRECT! ${q.correct}<br><span style="font-size:0.8rem;">💡 ${q.hint}</span></div>`;
            } else if (status === false) {
                feedbackHtml = `<div class="wrong-feedback">❌ WRONG. Correct: <strong>${q.correct}</strong><br><span style="font-size:0.8rem;">📖 ${q.hint}</span></div>`;
            } else {
                feedbackHtml = `<div class="neutral-feedback">⚡ Click an answer</div>`;
            }

            let optionsHtml = '';
            for (let opt of q.options) {
                optionsHtml += `<button class="option-btn" data-qidx="${i}" data-opt="${opt.replace(/"/g, '&quot;')}">${opt}</button>`;
            }

            html += `
                <div class="question-card">
                    <div class="question-text">❓ ${i+1}. ${q.text}</div>
                    <div class="options" id="options-${i}">
                        ${optionsHtml}
                    </div>
                    <div id="feedback-${i}">
                        ${feedbackHtml}
                    </div>
                </div>
            `;
        }
        questionsArea.innerHTML = html;

        for (let i = 0; i < questions.length; i++) {
            const btns = document.querySelectorAll(`.option-btn[data-qidx="${i}"]`);
            btns.forEach(btn => {
                btn.removeEventListener('click', clickHandler);
                btn.addEventListener('click', clickHandler);
            });
        }
    }

    function clickHandler(e) {
        const btn = e.currentTarget;
        const qidx = parseInt(btn.getAttribute('data-qidx'));
        const selected = btn.getAttribute('data-opt');
        const isCorrect = (selected === questions[qidx].correct);
        answerStatus[qidx] = isCorrect;
        selectedAnswers[qidx] = selected;
        renderQuestions();
        updateScore();
    }

    function resetQuiz() {
        answerStatus.fill(null);
        selectedAnswers.fill(null);
        renderQuestions();
        updateScore();
    }

    renderQuestions();
    updateScore();
    document.getElementById("resetQuizBtn").addEventListener("click", resetQuiz);
</script>
</body>
</html>
