<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Literary Match: Character → Story Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1e2a2c 0%, #0e1a1f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            font-family: 'Inter', system-ui, 'Segoe UI', 'Georgia', serif;
        }

        .quiz-match {
            max-width: 1100px;
            width: 100%;
            background: #fffcf0;
            background-image: radial-gradient(circle at 20% 40%, rgba(180, 130, 70, 0.05) 1.8%, transparent 2%);
            background-size: 28px 28px;
            border-radius: 2.2rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            background: #2c3e2b;
            padding: 1.3rem 2rem;
            color: #fcf3cf;
            border-bottom: 4px solid #e6b422;
        }

        .header h1 {
            font-size: 1.9rem;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 10px;
        }

        .story-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.8rem;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .story-list span {
            background: #3f5a49;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-family: monospace;
        }

        .quiz-body {
            padding: 2rem 2rem 1.5rem;
        }

        .progress-area {
            background: #e4dcc8;
            border-radius: 30px;
            height: 8px;
            margin-bottom: 1.8rem;
            overflow: hidden;
        }

        .progress-fill {
            background: #e6b422;
            width: 0%;
            height: 100%;
            transition: width 0.2s ease;
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-weight: 600;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .q-count {
            background: #d9cdae;
            padding: 0.2rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
        }

        .character-card {
            background: #f7f0e0;
            border-radius: 2rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e6d9bc;
            box-shadow: 0 8px 14px rgba(0, 0, 0, 0.05);
        }

        .character-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2f3e2c;
            letter-spacing: -0.3px;
            border-left: 6px solid #e6b422;
            padding-left: 1rem;
            margin-bottom: 0.5rem;
        }

        .story-options {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin: 1.5rem 0 1rem;
        }

        .story-option {
            background: white;
            border: 2px solid #ddd0ae;
            border-radius: 60px;
            padding: 0.8rem 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #2b3b28;
            font-size: 0.95rem;
        }

        .story-option:hover:not(.disabled-opt) {
            background: #fff2e0;
            border-color: #c49a2b;
            transform: scale(0.98);
        }

        .disabled-opt {
            pointer-events: none;
            opacity: 0.8;
        }

        .correct-highlight {
            background: #c9efd4 !important;
            border-color: #2b7a3e !important;
        }

        .wrong-highlight {
            background: #ffe1da !important;
            border-color: #bc3f26 !important;
            text-decoration: line-through;
        }

        .feedback {
            margin: 1rem 0 0.5rem;
            padding: 0.9rem 1.2rem;
            border-radius: 1.5rem;
            font-weight: 500;
            background: #ece2cf;
        }

        .feedback-correct {
            background: #e0f2e4;
            border-left: 8px solid #2e7d32;
        }

        .feedback-wrong {
            background: #ffe7e2;
            border-left: 8px solid #c23b22;
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .next-btn {
            background: #2c3e2f;
            border: none;
            padding: 0.7rem 2rem;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .next-btn:hover {
            background: #1e2e21;
            transform: scale(0.97);
        }

        .reset-btn {
            background: #735e3a;
            padding: 0.5rem 1.3rem;
            font-size: 0.8rem;
        }

        .footer-stats {
            background: #e2d5ba;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            border-top: 1px solid #cebf9b;
            color: #2d3e28;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            .quiz-body { padding: 1.5rem; }
            .character-name { font-size: 1.4rem; }
            .story-option { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="quiz-match" id="matchQuizRoot">
    <div class="header">
        <h1>📚 CHARACTER → STORY <span style="font-size:0.8rem;">matching quiz</span></h1>
        <div class="story-list">
            <span>The Man to Send Rain Clouds</span> <span>If I Forget Thee, O Earth</span> <span>The Gift of the Magi</span>
            <span>The Scarlet Ibis</span> <span>The Necklace</span> <span>The Secret Life of Walter Mitty</span>
            <span>Romeo and Juliet</span> <span>Sympathy</span> <span>Casey at the Bat</span>
            <span>The Raven</span> <span>The Charge of the Light Brigade</span>
        </div>
    </div>
    <div id="quizMatchContent"></div>
</div>

<script>
    // Character to Story mapping (all requested works)
    // For "Sympathy" (poem by Paul Laurence Dunbar) – the speaker/narrator (caged bird)
    // For poems: "The Raven" (main character: narrator / Lenore reference)
    // "Casey at the Bat" – Casey
    // "The Charge of the Light Brigade" – noble soldiers / "the six hundred"
    // I'll craft clear character identifiers.
    
    const characterData = [
        { character: "Leon (Teofilo's grandson) / Father Paul", story: "The Man to Send Rain Clouds", hint: "Pueblo funeral & feather ritual" },
        { character: "Marvin / The boy (Clifford?) & his father", story: "If I Forget Thee, O Earth", hint: "Post-apocalyptic lunar colony, view of irradiated Earth" },
        { character: "Jim (James Dillingham Young) & Della", story: "The Gift of the Magi", hint: "Selling prized possessions for a Christmas gift" },
        { character: "Brother (narrator) & Doodle", story: "The Scarlet Ibis", hint: "Tragic bird, bleeding tree, pride and love" },
        { character: "Mathilde Loisel", story: "The Necklace", hint: "Diamond necklace, ten years of hard labor" },
        { character: "Walter Mitty", story: "The Secret Life of Walter Mitty", hint: "Daydreaming commander, ice pilot, surgeon" },
        { character: "Romeo Montague / Juliet Capulet", story: "Romeo and Juliet", hint: "Star-crossed lovers, Verona, poison" },
        { character: "The caged bird (speaker/narrator)", story: "Sympathy", hint: "Paul Laurence Dunbar poem: 'I know why the caged bird sings'" },
        { character: "Casey (Mighty Casey)", story: "Casey at the Bat", hint: "Mudville, mighty Casey strikes out" },
        { character: "The narrator (grieving scholar) / Lenore", story: "The Raven", hint: "Nevermore, midnight dreary, bust of Pallas" },
        { character: "The six hundred (British light cavalry)", story: "The Charge of the Light Brigade", hint: "Valley of Death, 'Cannon to right of them'" }
    ];

    // Build full question set: each question will show a character, need to pick correct story from shuffled options.
    // We'll include all 11 stories as possible choices, but each question gets random order.
    const allStories = [
        "The Man to Send Rain Clouds",
        "If I Forget Thee, O Earth",
        "The Gift of the Magi",
        "The Scarlet Ibis",
        "The Necklace",
        "The Secret Life of Walter Mitty",
        "Romeo and Juliet",
        "Sympathy",
        "Casey at the Bat",
        "The Raven",
        "The Charge of the Light Brigade"
    ];

    let currentIndex = 0;
    let userMatches = new Array(characterData.length).fill(null); // store story string
    let quizFinished = false;
    let questionOrder = [];        // indices in randomized order for extra challenge
    let optionPools = [];          // for each question (in order) we store shuffled story list

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuiz() {
        // create question order (randomize character order)
        questionOrder = [...Array(characterData.length).keys()];
        shuffleArray(questionOrder);
        // for each position, pre-shuffle the story options (allStories)
        optionPools = [];
        for (let i = 0; i < characterData.length; i++) {
            let shuffledStories = [...allStories];
            shuffleArray(shuffledStories);
            optionPools.push(shuffledStories);
        }
        userMatches = new Array(characterData.length).fill(null);
        currentIndex = 0;
        quizFinished = false;
    }

    // helper to get current real index into characterData
    function getCurrentRealIdx() {
        return questionOrder[currentIndex];
    }

    function saveMatch(storySelected) {
        if (quizFinished) return;
        const realIdx = getCurrentRealIdx();
        if (userMatches[realIdx] !== null) return; // already answered
        userMatches[realIdx] = storySelected;
        renderCurrentQuestion();
    }

    function goToNext() {
        if (quizFinished) return;
        const realIdx = getCurrentRealIdx();
        if (userMatches[realIdx] === null) {
            alert("Please match this character to a story before continuing.");
            return;
        }
        if (currentIndex + 1 < questionOrder.length) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            finishMatchingQuiz();
        }
    }

    function finishMatchingQuiz() {
        quizFinished = true;
        let score = 0;
        for (let i = 0; i < characterData.length; i++) {
            const originalIndex = i;
            const userChoice = userMatches[originalIndex];
            const correctStory = characterData[originalIndex].story;
            if (userChoice && userChoice === correctStory) score++;
        }
        const percent = Math.round((score / characterData.length) * 100);
        let rating = percent >= 85 ? "📖 LITERARY DETECTIVE" : (percent >= 65 ? "📚 GOOD MEMORY" : "📝 REVIEW REQUIRED");
        let resultHtml = `
            <div class="quiz-body">
                <div class="progress-area"><div class="progress-fill" style="width:100%"></div></div>
                <div style="background:#e9dfc6; border-radius: 2rem; padding: 2rem; text-align: center;">
                    <h2 style="font-size:2rem;">🏆 ${score} / ${characterData.length}</h2>
                    <p style="font-size:1.2rem;">Match accuracy: ${percent}% — ${rating}</p>
                    <p style="margin-top:1rem;">✨ Stories matched: The Man to Send Rain Clouds, If I Forget Thee O Earth, Gift of the Magi, The Scarlet Ibis, The Necklace, Secret Life of Walter Mitty, Romeo and Juliet, Sympathy, Casey at the Bat, The Raven, The Charge of the Light Brigade ✨</p>
                    <button class="next-btn reset-btn" id="resetMatchQuiz" style="background:#5e4a2e; margin-top:1.5rem;">⟳ PLAY AGAIN (CHARACTER MATCH)</button>
                </div>
            </div>
            <div class="footer-stats">🎭 character-to-story | classic literature & poetry edition</div>
        `;
        const container = document.getElementById("quizMatchContent");
        container.innerHTML = resultHtml;
        document.getElementById("resetMatchQuiz")?.addEventListener("click", () => {
            initQuiz();
            renderCurrentQuestion();
        });
    }

    function renderCurrentQuestion() {
        if (quizFinished) return;
        const realIdx = getCurrentRealIdx();
        const charObj = characterData[realIdx];
        const selectedStory = userMatches[realIdx];
        const isAnswered = selectedStory !== null;
        const correctStory = charObj.story;
        const isCorrect = isAnswered && (selectedStory === correctStory);
        
        const currentOptions = optionPools[currentIndex]; // pre-shuffled stories

        let feedbackHtml = "";
        if (isAnswered) {
            if (isCorrect) {
                feedbackHtml = `<div class="feedback feedback-correct">✅ Perfect match! "${charObj.character}" belongs to <strong>${correctStory}</strong>. ${charObj.hint ? `(hint: ${charObj.hint})` : ''}</div>`;
            } else {
                feedbackHtml = `<div class="feedback feedback-wrong">❌ Mismatch. "${charObj.character}" is from <strong>${correctStory}</strong>. ${charObj.hint ? `🔍 clue: ${charObj.hint}` : ''}</div>`;
            }
        } else {
            feedbackHtml = `<div class="feedback" style="background:#f2ecd9;">⚡ Which story features this character? (click on one option)</div>`;
        }

        let optionsHtml = "";
        currentOptions.forEach(storyTitle => {
            let additional = "";
            let clickableAttr = "";
            if (isAnswered) {
                additional = "disabled-opt";
                if (storyTitle === correctStory) additional += " correct-highlight";
                if (selectedStory === storyTitle && storyTitle !== correctStory) additional += " wrong-highlight";
            } else {
                clickableAttr = `onclick="saveMatch('${storyTitle.replace(/'/g, "\\'")}')"`;
            }
            optionsHtml += `<div class="story-option ${additional}" ${clickableAttr}>📖 ${storyTitle}</div>`;
        });

        const totalQuestions = questionOrder.length;
        const answeredCount = userMatches.filter(v => v !== null).length;
        const progressPercent = ((currentIndex) / totalQuestions) * 100;

        const container = document.getElementById("quizMatchContent");
        const mainContent = `
            <div class="quiz-body">
                <div class="progress-area">
                    <div class="progress-fill" style="width: ${progressPercent}%"></div>
                </div>
                <div class="q-meta">
                    <span class="q-count">🎭 character ${currentIndex+1} of ${totalQuestions}</span>
                    <span style="font-size:0.7rem; background:#cfc29e; padding:0.2rem 0.8rem; border-radius:20px;">match to story</span>
                </div>
                <div class="character-card">
                    <div class="character-name">“${charObj.character}”</div>
                    <div style="font-size:0.85rem; margin-top: 0.3rem; color:#6a5e45;">${charObj.hint ? `⚡ ${charObj.hint}` : "✍️ identify the correct literary work"}</div>
                </div>
                <div class="story-options" id="storyOpts">
                    ${optionsHtml}
                </div>
                ${feedbackHtml}
                <div class="actions">
                    <span style="background:#e3d7be; padding:0.2rem 1rem; border-radius:30px;">📌 matched: ${answeredCount}/${totalQuestions}</span>
                    <button class="next-btn" id="nextMatchBtn">${currentIndex+1 === totalQuestions ? "🏁 FINISH QUIZ" : "NEXT →"}</button>
                </div>
                <div style="margin-top: 1.2rem; text-align: left;">
                    <button class="next-btn reset-btn" id="resetDuringMatch" style="background:#725e3b;">⟳ Restart Quiz</button>
                </div>
            </div>
            <div class="footer-stats">
                <span>📖 The Raven · Casey · Walter Mitty · Mathilde · Doodle · The six hundred</span>
                <span>✔️ ${answeredCount} matched</span>
            </div>
        `;
        container.innerHTML = mainContent;
        const nextBtn = document.getElementById("nextMatchBtn");
        if (nextBtn) nextBtn.addEventListener("click", goToNext);
        const resetBtn = document.getElementById("resetDuringMatch");
        if (resetBtn) resetBtn.addEventListener("click", () => {
            initQuiz();
            renderCurrentQuestion();
        });
    }

    // start the quiz
    initQuiz();
    renderCurrentQuestion();
</script>
</body>
</html>
