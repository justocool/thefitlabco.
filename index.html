<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Romeo and Juliet Matching Game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* avoid accidental text selection while dragging */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fdf6e3;
            color: #3e2a1f;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #8b3c2c;
            font-size: 2rem;
            margin-bottom: 0.2rem;
        }

        .sub {
            text-align: center;
            font-style: italic;
            margin-bottom: 2rem;
            color: #6b4c3b;
        }

        /* Game selector */
        .game-selector {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .game-btn {
            background: #d9c2a7;
            border: none;
            padding: 10px 24px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 40px;
            cursor: pointer;
            color: #3e2a1f;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .game-btn.active {
            background: #8b3c2c;
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .game-btn:hover:not(.active) {
            background: #c4a27a;
        }

        /* Score & status */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            background: #efe2cf;
            padding: 12px 20px;
            border-radius: 50px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .score {
            font-size: 1.4rem;
            background: #3e2a1f;
            color: #ffefcf;
            padding: 4px 14px;
            border-radius: 40px;
        }

        .message {
            background: #fff3e0;
            padding: 6px 16px;
            border-radius: 30px;
            color: #8b3c2c;
        }

        .reset-btn {
            background: #7c5f44;
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .reset-btn:hover {
            background: #5a3e2a;
        }

        /* Game grid: two columns */
        .game-board {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            justify-content: center;
        }

        .column {
            flex: 1;
            min-width: 280px;
            background: #fffaf2;
            border-radius: 40px;
            padding: 20px 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .column h2 {
            text-align: center;
            border-bottom: 2px solid #d9c2a7;
            padding-bottom: 8px;
            margin-top: 0;
            color: #5c3b28;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: white;
            border-left: 12px solid #b1624b;
            padding: 14px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: 0.1s linear;
            font-size: 0.95rem;
            font-weight: 500;
            color: #2c1a10;
        }

        .card.selected {
            background: #ffe3b5;
            border-left-color: #d48c3c;
            box-shadow: 0 0 0 2px #d48c3c;
            transform: scale(1.01);
        }

        .card.matched {
            background: #cfe6cf;
            border-left-color: #2c6e2c;
            text-decoration: line-through;
            opacity: 0.7;
            cursor: default;
            filter: grayscale(0.05);
        }

        .card.matched::after {
            content: " ✓";
            font-weight: bold;
            color: #1f5c1f;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: #8b6e55;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .game-selector, .reset-btn, .status-bar .message, .footer {
                display: none;
            }
            .card {
                break-inside: avoid;
                border: 1px solid #aaa;
            }
            .card.matched {
                text-decoration: none;
                opacity: 1;
            }
            .card.matched::after {
                content: " (matched)";
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚔️ Romeo & Juliet ⚔️</h1>
    <div class="sub">Matching Game — Act to Settings / Act to Plot</div>

    <div class="game-selector">
        <button class="game-btn" data-game="settings">🎭 Act → Setting</button>
        <button class="game-btn" data-game="plot">📖 Act → Plot Summary</button>
    </div>

    <div class="status-bar">
        <span>🎯 Matches: <span id="scoreValue">0</span> / <span id="totalValue">5</span></span>
        <span class="message" id="statusMsg">Click a card from left, then right</span>
        <button class="reset-btn" id="resetGame">⟳ New Game</button>
    </div>

    <div class="game-board">
        <!-- LEFT COLUMN: ACTS -->
        <div class="column">
            <h2>📜 ACTS (1–5)</h2>
            <div id="actsContainer" class="cards"></div>
        </div>
        <!-- RIGHT COLUMN: MATCHING ITEMS (settings or plots) -->
        <div class="column">
            <h2 id="rightTitle">🎭 Settings</h2>
            <div id="matchesContainer" class="cards"></div>
        </div>
    </div>
    <div class="footer">Click an Act, then click a matching card. Correct pairs lock. Press "New Game" to shuffle & reset.</div>
</div>

<script>
    // ---------- DATA ----------
    // Setting data (act -> matching text)
    const settingsData = {
        1: "Verona streets (public brawl), Capulet’s house (feast & first meeting)",
        2: "Capulet’s orchard (balcony scene), Friar Laurence’s cell (secret marriage)",
        3: "Verona square (Mercutio & Tybalt killed), Capulet’s orchard (wedding night & Romeo flees)",
        4: "Friar’s cell (potion plan), Juliet’s bedroom (takes potion), Capulet house (found ‘dead’)",
        5: "Mantua (Romeo hears news), Apothecary (buys poison), Capulet tomb (deaths & reconciliation)"
    };

    // Plot summary data
    const plotData = {
        1: "Romeo and Juliet meet at a Capulet feast and fall in love without knowing each other’s family identities.",
        2: "They exchange vows on the balcony and marry in secret with the help of Friar Laurence and the Nurse.",
        3: "Mercutio is killed by Tybalt; Romeo kills Tybalt and is banished. He spends one night with Juliet, then flees to Mantua. Juliet is ordered to marry Paris.",
        4: "Juliet takes a potion to appear dead for 42 hours. Her family finds her ‘dead’ and places her in the tomb.",
        5: "Romeo, believing Juliet is dead, buys poison and kills himself at her tomb. Juliet wakes, stabs herself, and the families end their feud."
    };

    // Game state
    let currentGame = "settings";      // 'settings' or 'plot'
    let acts = [1,2,3,4,5];            // act numbers
    let matches = [];                  // will hold the right side items (strings) shuffled
    let matchedActs = new Array(6).fill(false); // index 1..5
    let matchedItems = new Array(6).fill(false);
    let selectedAct = null;            // currently selected act number
    let selectedItemIdx = null;        // index in matches array (for UI highlight)

    // DOM elements
    const actsContainer = document.getElementById("actsContainer");
    const matchesContainer = document.getElementById("matchesContainer");
    const scoreSpan = document.getElementById("scoreValue");
    const totalSpan = document.getElementById("totalValue");
    const statusMsg = document.getElementById("statusMsg");
    const resetBtn = document.getElementById("resetGame");
    const rightTitle = document.getElementById("rightTitle");

    // Helper: get current mapping dictionary
    function getCurrentMapping() {
        return currentGame === "settings" ? settingsData : plotData;
    }

    // Helper: get right side items array (shuffled)
    function getShuffledRightItems() {
        const mapping = getCurrentMapping();
        const items = [];
        for (let act = 1; act <= 5; act++) {
            items.push({ act: act, text: mapping[act] });
        }
        // shuffle Fisher-Yates
        for (let i = items.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [items[i], items[j]] = [items[j], items[i]];
        }
        return items;
    }

    // reset full game (preserve game type)
    function resetGame() {
        // reset match arrays
        matchedActs.fill(false);
        matchedItems.fill(false);
        selectedAct = null;
        selectedItemIdx = null;
        
        // fresh shuffle of right side items (based on current game)
        const shuffledItems = getShuffledRightItems();
        matches.length = 0;
        for (let item of shuffledItems) {
            matches.push({ act: item.act, text: item.text, matched: false });
        }
        
        // re-render
        renderGame();
        updateScoreAndMessage();
    }

    // switch between settings and plot
    function setGameType(type) {
        currentGame = type;
        // update UI buttons
        document.querySelectorAll(".game-btn").forEach(btn => {
            if (btn.dataset.game === type) btn.classList.add("active");
            else btn.classList.remove("active");
        });
        rightTitle.innerText = (type === "settings") ? "🎭 Settings" : "📖 Plot Summaries";
        resetGame(); // rebuild with new data and shuffle
    }

    // count current matched pairs
    function countMatched() {
        let count = 0;
        for (let i = 1; i <= 5; i++) {
            if (matchedActs[i] && matchedItems[i]) count++;
        }
        return count;
    }

    function updateScoreAndMessage() {
        const matchedCount = countMatched();
        scoreSpan.innerText = matchedCount;
        totalSpan.innerText = "5";
        if (matchedCount === 5) {
            statusMsg.innerHTML = "🎉 PERFECT! All acts matched! 🎉";
        } else {
            statusMsg.innerHTML = "💡 Click an Act, then click its matching description.";
        }
    }

    // attempt to match selectedAct (number) with a right-side card by its internal act value
    function attemptMatch(selectedRightIdx) {
        const rightCard = matches[selectedRightIdx];
        if (!rightCard || rightCard.matched) {
            statusMsg.innerHTML = "⛔ That item is already matched!";
            return false;
        }
        if (selectedAct === null) {
            statusMsg.innerHTML = "👈 First, click an Act on the left!";
            return false;
        }
        if (matchedActs[selectedAct]) {
            statusMsg.innerHTML = `⚠️ Act ${selectedAct} is already matched! Reset or choose another.`;
            clearSelectedAct();
            renderGame();
            return false;
        }
        
        const expectedAct = rightCard.act;
        if (selectedAct === expectedAct) {
            // CORRECT MATCH!
            matchedActs[selectedAct] = true;
            matchedItems[expectedAct] = true;
            rightCard.matched = true;
            statusMsg.innerHTML = `✅ Correct! Act ${selectedAct} matched!`;
            clearSelectedAct();
            renderGame();
            updateScoreAndMessage();
            return true;
        } else {
            // wrong match
            statusMsg.innerHTML = `❌ Wrong! Act ${selectedAct} does NOT match "${rightCard.text.substring(0, 60)}..." Try again.`;
            clearSelectedAct();
            renderGame();
            return false;
        }
    }

    function clearSelectedAct() {
        selectedAct = null;
        if (selectedItemIdx !== null) {
            // remove highlight from right side if any
            selectedItemIdx = null;
        }
    }

    // ----- RENDER left (acts) and right (matches) -----
    function renderGame() {
        // Render acts column
        actsContainer.innerHTML = "";
        for (let i = 0; i < acts.length; i++) {
            const actNum = acts[i];
            const isMatched = matchedActs[actNum];
            const cardDiv = document.createElement("div");
            cardDiv.className = "card";
            if (isMatched) cardDiv.classList.add("matched");
            if (selectedAct === actNum && !isMatched) cardDiv.classList.add("selected");
            cardDiv.innerText = `Act ${actNum}`;
            if (!isMatched) {
                cardDiv.style.cursor = "pointer";
                cardDiv.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (matchedActs[actNum]) {
                        statusMsg.innerHTML = `🔒 Act ${actNum} is already matched.`;
                        return;
                    }
                    // clear previous selection on left & right highlight
                    if (selectedItemIdx !== null) {
                        // remove possible right highlight (by re-render)
                    }
                    selectedAct = actNum;
                    selectedItemIdx = null;
                    renderGame();   // re-render to show new selection
                    statusMsg.innerHTML = `🎭 Act ${actNum} selected. Now click its matching ${currentGame === "settings" ? "setting" : "plot summary"}.`;
                });
            } else {
                cardDiv.style.cursor = "default";
            }
            actsContainer.appendChild(cardDiv);
        }
        
        // Render right column (matches)
        matchesContainer.innerHTML = "";
        for (let idx = 0; idx < matches.length; idx++) {
            const item = matches[idx];
            const cardDiv = document.createElement("div");
            cardDiv.className = "card";
            if (item.matched) {
                cardDiv.classList.add("matched");
                cardDiv.style.cursor = "default";
            } else {
                cardDiv.style.cursor = "pointer";
            }
            // Optional: add light highlight if this index is currently selected (not used in this logic, but friendly)
            if (selectedItemIdx === idx && !item.matched) cardDiv.classList.add("selected");
            // short preview for plot if too long? we show full.
            cardDiv.innerText = item.text;
            if (!item.matched) {
                cardDiv.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (item.matched) return;
                    if (selectedAct === null) {
                        statusMsg.innerHTML = "👉 First select an Act (left column).";
                        return;
                    }
                    if (matchedActs[selectedAct]) {
                        statusMsg.innerHTML = `⚠️ Act ${selectedAct} already matched. Reset or pick different act.`;
                        clearSelectedAct();
                        renderGame();
                        return;
                    }
                    // attempt match directly
                    attemptMatch(idx);
                });
            }
            matchesContainer.appendChild(cardDiv);
        }
    }

    // Event listeners for game mode buttons
    document.querySelectorAll(".game-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
            const gameType = btn.dataset.game;
            setGameType(gameType);
        });
    });
    
    resetBtn.addEventListener("click", () => {
        resetGame();
        statusMsg.innerHTML = "🔄 Game reset. Ready to match!";
        clearSelectedAct();
    });
    
    // initial load
    setGameType("settings");
</script>
</body>
</html>
