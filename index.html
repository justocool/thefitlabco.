<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Literary Terms → Story Examples Match (Hard Mode)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #0c1a24 0%, #142830 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
            font-family: 'Inter', system-ui, 'Segoe UI', 'Georgia', serif;
        }
        .quiz-arena {
            max-width: 1200px;
            width: 100%;
            background: #fef7ec;
            border-radius: 2.5rem;
            box-shadow: 0 30px 50px rgba(0,0,0,0.45);
            overflow: hidden;
        }
        .quiz-header {
            background: #1e2f2c;
            padding: 1.5rem 2rem;
            border-bottom: 4px solid #e6b422;
            color: #fffbee;
        }
        .quiz-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
        }
        .badge-hard {
            background: #b4652a;
            padding: 0.2rem 1rem;
            border-radius: 60px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fae67a;
        }
        .story-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-top: 1rem;
            font-size: 0.7rem;
            font-family: monospace;
        }
        .story-strip span {
            background: #2e4a3e;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            font-weight: 500;
        }
        .quiz-core {
            padding: 2rem 2rem 1.5rem;
        }
        .progress-bar {
            background: #e2d8c2;
            border-radius: 40px;
            height: 8px;
            margin-bottom: 1.8rem;
            overflow: hidden;
        }
        .progress-fill {
            background: #e6b422;
            width: 0%;
            height: 100%;
            transition: width 0.2s ease;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .q-counter {
            background: #e3d7bf;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.85rem;
            color: #2f412a;
        }
        .term-card {
            background: #f3efdf;
            border-radius: 2rem;
            padding: 1.6rem;
            margin-bottom: 2rem;
            border: 1px solid #e7dbbc;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05);
        }
        .term-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2c3e2b;
            border-left: 6px solid #e6b422;
            padding-left: 1rem;
            margin-bottom: 0.75rem;
        }
        .term-def {
            font-size: 0.9rem;
            color: #6a5e45;
            margin-left: 1rem;
            font-style: italic;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.8rem 0 1.5rem;
        }
        .opt-btn {
            background: white;
            border: 2px solid #ddcfaa;
            border-radius: 60px;
            padding: 0.9rem 1.3rem;
            font-size: 1rem;
            font-weight: 600;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.2s;
            color: #2b3927;
        }
        .opt-btn:hover:not(.disabled-opt) {
            background: #fff6e8;
            border-color: #c49a2b;
            transform: scale(0.98);
        }
        .disabled-opt {
            cursor: default;
            pointer-events: none;
            opacity: 0.85;
        }
        .correct-opt {
            background: #ccf0d6 !important;
            border-color: #2b7a3e !important;
        }
        .wrong-opt {
            background: #ffe0d9 !important;
            border-color: #bc3f26 !important;
            text-decoration: line-through;
        }
        .feedback-panel {
            background: #ede3cf;
            border-radius: 1.5rem;
            padding: 1rem 1.5rem;
            margin: 1rem 0;
            font-weight: 500;
        }
        .feedback-correct {
            background: #dff0e3;
            border-left: 8px solid #2e7d32;
            color: #1b4d2b;
        }
        .feedback-wrong {
            background: #fee9e4;
            border-left: 8px solid #bc3f26;
            color: #842e1a;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .next-button {
            background: #2c3e2f;
            border: none;
            padding: 0.8rem 2.2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 60px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .next-button:hover {
            background: #1f2e21;
            transform: scale(0.97);
        }
        .reset-sm {
            background: #785f3c;
            padding: 0.5rem 1.4rem;
            font-size: 0.85rem;
        }
        .score-footer {
            background: #e4d8be;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #2f402a;
            font-size: 0.85rem;
            border-top: 1px solid #d4c5a2;
            flex-wrap: wrap;
        }
        @media (max-width: 650px) {
            .quiz-core { padding: 1.5rem; }
            .term-name { font-size: 1.4rem; }
            .opt-btn { font-size: 0.85rem; padding: 0.7rem 1rem; }
        }
    </style>
</head>
<body>
<div class="quiz-arena" id="quizApp">
    <div class="quiz-header">
        <h1>📖 TERM → STORY EXAMPLE <span class="badge-hard">⚡ match the literary device</span></h1>
        <div class="story-strip">
            <span>The Man to Send Rain Clouds</span> <span>If I Forget Thee, O Earth</span> <span>The Gift of the Magi</span>
            <span>The Scarlet Ibis</span> <span>The Necklace</span> <span>The Secret Life of Walter Mitty</span>
            <span>Romeo and Juliet</span> <span>Sympathy</span> <span>Casey at the Bat</span>
            <span>The Raven</span> <span>The Charge of the Light Brigade</span>
        </div>
    </div>
    <div id="quizDynamicContent"></div>
</div>

<script>
    // ----- LITERARY TERMS with SPECIFIC STORY EXAMPLES from the given works -----
    const questions = [
        { term: "Protagonist", definition: "The main character driving the action.",
          example: "Leon / Teofilo's family in the pueblo funeral rites.", correctStory: "The Man to Send Rain Clouds" },
        { term: "Antagonist", definition: "Character or force opposing the protagonist.",
          example: "The radioactive, destroyed Earth that forces humanity into exile.", correctStory: "If I Forget Thee, O Earth" },
        { term: "Blank verse", definition: "Unrhymed iambic pentameter.",
          example: "Much of the dialogue in the Verona tragedy is written in this form.", correctStory: "Romeo and Juliet" },
        { term: "Iambic pentameter", definition: "Five iambic feet per line (da-DUM x5).",
          example: "The noble cavalry charge narrated with rhythmic intensity — 'Half a league, half a league, half a league onward' (though anapestic, the poem uses strong metrical beat).", correctStory: "The Charge of the Light Brigade" },
        { term: "Iamb", definition: "Unstressed + stressed syllable (˘ ′).",
          example: "The word 'belong' or the rhythmic base of many lines in 'The Raven' ('Once upON a MIDnight DREARy').", correctStory: "The Raven" },
        { term: "Aside", definition: "Short remark to audience, unheard by others.",
          example: "When Walter Mitty imagines being a surgeon and mutters a confident line to himself — his daydream as internal stage aside.", correctStory: "The Secret Life of Walter Mitty" },
        { term: "Monologue", definition: "Long speech by one character to others on stage.",
          example: "The narrator's extended description of Doodle's birth and the scarlet ibis's death, addressed to the reader as an internal monologue.", correctStory: "The Scarlet Ibis" },
        { term: "Soliloquy", definition: "Speech alone on stage, revealing inner thoughts.",
          example: "The grieving scholar's midnight reflections as the raven taps — 'weak and weary' — spoken in solitude of his chamber.", correctStory: "The Raven" },
        { term: "Dramatic foil", definition: "Character contrasting with another to highlight traits.",
          example: "Doodle's fragile, imaginative nature vs. the narrator's strong, prideful ambition.", correctStory: "The Scarlet Ibis" },
        { term: "Dramatic irony", definition: "Audience knows more than the character.",
          example: "When Mathilde Loisel borrows the necklace, we later understand it was a fake — but she spends ten years in misery before learning the truth.", correctStory: "The Necklace" },
        { term: "Tragedy", definition: "Protagonist suffers catastrophic downfall evoking pity/fear.",
          example: "The star-crossed lovers' double suicide ends the feud but at immense cost.", correctStory: "Romeo and Juliet" },
        { term: "Theme", definition: "Central message about life or human nature.",
          example: "Sacrificial love and the true value of giving — the hair and watch gifts prove priceless despite being unusable.", correctStory: "The Gift of the Magi" },
        { term: "Dramatic tragedy", definition: "Serious stage work with ruin of main character.",
          example: "The sixth hundred charging into certain death due to a blundered order — 'Into the valley of Death rode the six hundred.'", correctStory: "The Charge of the Light Brigade" },
        { term: "Tragic hero", definition: "Noble character with fatal flaw leading to downfall.",
          example: "Casey, the mighty slugger whose arrogance and overconfidence make him strike out, losing the game for Mudville.", correctStory: "Casey at the Bat" },
        { term: "Symbol", definition: "Object representing abstract idea.",
          example: "The feather and holy water that blend Christian and Pueblo traditions to send rain clouds.", correctStory: "The Man to Send Rain Clouds" },
        { term: "Narrative poem", definition: "Poetry that tells a story with plot and characters.",
          example: "The tale of the Mudville baseball team's final inning and Casey's strikeout.", correctStory: "Casey at the Bat" },
        { term: "Repetition", definition: "Repeated word/phrase for emphasis.",
          example: "'Nevermore' echoes again and again in the scholar's chamber, driving him to despair.", correctStory: "The Raven" },
        { term: "Refrain", definition: "Regularly recurring line or stanza (like a chorus).",
          example: "The repeated call 'Rage, rage against the dying of the light' (though from a different poem) — but here, the thematic echo: in 'Sympathy', the refrain-like longing: 'I know why the caged bird sings!'", correctStory: "Sympathy" },
        { term: "Rhythm", definition: "Pattern of stressed/unstressed syllables creating flow.",
          example: "The anapestic galloping rhythm in 'The Charge of the Light Brigade' mimics horses charging into battle.", correctStory: "The Charge of the Light Brigade" }
    ];

    // Shuffle options for each question (all story titles + correct story + random others)
    const ALL_STORIES = [
        "The Man to Send Rain Clouds", "If I Forget Thee, O Earth", "The Gift of the Magi",
        "The Scarlet Ibis", "The Necklace", "The Secret Life of Walter Mitty",
        "Romeo and Juliet", "Sympathy", "Casey at the Bat", "The Raven", "The Charge of the Light Brigade"
    ];

    let randomizedOptions = [];
    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let quizFinished = false;

    function buildShuffledOptionsForQuestion(correctStory) {
        // take all stories, ensure correct is included, shuffle
        let opts = [...ALL_STORIES];
        for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        return opts;
    }

    function initRandomizedOptions() {
        randomizedOptions = questions.map(q => buildShuffledOptionsForQuestion(q.correctStory));
    }

    const container = document.getElementById("quizDynamicContent");

    function saveAnswer(questionIdx, selectedStory) {
        if (quizFinished) return;
        if (userAnswers[questionIdx] !== null) return;
        userAnswers[questionIdx] = selectedStory;
        renderCurrentQuestion();
    }

    function goToNext() {
        if (quizFinished) return;
        if (userAnswers[currentIndex] === null) {
            alert("⚠️ Select a story example that matches the literary term before moving on.");
            return;
        }
        if (currentIndex + 1 < questions.length) {
            currentIndex++;
            renderCurrentQuestion();
        } else {
            finishQuiz();
        }
    }

    function finishQuiz() {
        quizFinished = true;
        let score = 0;
        for (let i = 0; i < questions.length; i++) {
            if (userAnswers[i] && userAnswers[i] === questions[i].correctStory) {
                score++;
            }
        }
        const percent = Math.round((score / questions.length) * 100);
        let verdict = percent >= 85 ? "🏅 LITERARY MASTER" : (percent >= 65 ? "📘 SCHOLAR" : "⚔️ NEEDS REVISION");
        let resultHtml = `
            <div class="quiz-core">
                <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
                <div style="background:#ece1cb; border-radius: 2rem; padding: 2rem; text-align: center;">
                    <h2 style="font-size:2rem; letter-spacing:-0.5px;">${score} / ${questions.length}</h2>
                    <p style="font-size:1.3rem; font-weight:600;">Accuracy: ${percent}% — ${verdict}</p>
                    <p style="margin-top:1rem; background:#dacdae; display:inline-block; padding:0.4rem 1.2rem; border-radius:40px;">✅ 19 literary terms matched to story examples</p>
                    <div style="margin-top: 1.8rem;">
                        <button class="next-button reset-sm" id="fullResetBtn" style="background:#4f3a24;">⟳ RESTART QUIZ</button>
                    </div>
                </div>
            </div>
            <div class="score-footer">🎯 literary term → specific story example | harder than definitions</div>
        `;
        container.innerHTML = resultHtml;
        document.getElementById("fullResetBtn")?.addEventListener("click", () => resetQuiz());
    }

    function resetQuiz() {
        currentIndex = 0;
        userAnswers = new Array(questions.length).fill(null);
        quizFinished = false;
        initRandomizedOptions();
        renderCurrentQuestion();
    }

    function renderCurrentQuestion() {
        if (quizFinished) return;
        const q = questions[currentIndex];
        const currentOptions = randomizedOptions[currentIndex];
        const selected = userAnswers[currentIndex];
        const isAnswered = selected !== null;
        const isCorrect = isAnswered && (selected === q.correctStory);

        let feedbackHtml = "";
        if (isAnswered) {
            if (isCorrect) {
                feedbackHtml = `<div class="feedback-panel feedback-correct">✅ EXACT MATCH. "${q.term}" — the example from <strong>${q.correctStory}</strong> is correct.</div>`;
            } else {
                feedbackHtml = `<div class="feedback-panel feedback-wrong">❌ Incorrect match. The term <strong>${q.term}</strong> (${q.definition}) is best exemplified by <strong>${q.correctStory}</strong>.<br><span style="font-size:0.85rem;">🔍 Example hint: ${q.example}</span></div>`;
            }
        }

        let optionsHtml = "";
        currentOptions.forEach(storyTitle => {
            let additionalClasses = "";
            let clickHandler = "";
            if (isAnswered) {
                additionalClasses = "disabled-opt";
                if (storyTitle === q.correctStory) {
                    additionalClasses += " correct-opt";
                }
                if (selected === storyTitle && storyTitle !== q.correctStory) {
                    additionalClasses += " wrong-opt";
                }
            } else {
                clickHandler = `onclick="saveAnswer(${currentIndex}, '${storyTitle.replace(/'/g, "\\'")}')"`;
            }
            optionsHtml += `<div class="opt-btn ${additionalClasses}" ${clickHandler}>📖 ${storyTitle}</div>`;
        });

        const total = questions.length;
        const answeredCount = userAnswers.filter(v => v !== null).length;
        const progressPercent = ((currentIndex) / total) * 100;

        const mainHtml = `
            <div class="quiz-core">
                <div class="progress-bar">
                    <div class="progress-fill" style="width: ${progressPercent}%"></div>
                </div>
                <div class="question-header">
                    <span class="q-counter">🔖 term ${currentIndex+1} of ${total}</span>
                    <span style="font-size:0.7rem; background:#d8cbad; padding:0.2rem 0.8rem; border-radius:30px;">match term → story example</span>
                </div>
                <div class="term-card">
                    <div class="term-name">${q.term}</div>
                    <div class="term-def">${q.definition}</div>
                    <div style="margin-top: 0.8rem; font-size:0.85rem; color:#b4652a; border-top: 1px dashed #e6d9bc; padding-top:0.6rem;">📌 specific clue: “${q.example}”</div>
                </div>
                <div class="options-grid" id="optionsContainer">
                    ${optionsHtml}
                </div>
                ${feedbackHtml}
                <div class="action-bar">
                    <span style="background:#e9deca; padding:0.2rem 1rem; border-radius:40px;">📌 answered: ${answeredCount}/${total}</span>
                    <button class="next-button" id="nextBtnAction">${currentIndex+1 === total ? "🏁 SUBMIT QUIZ" : "NEXT →"}</button>
                </div>
                <div style="margin-top: 1rem; text-align: right;">
                    <button class="next-button reset-sm" id="resetMidQuiz" style="background:#755f3a;">⟳ Restart Quiz</button>
                </div>
            </div>
            <div class="score-footer">
                <span>⚡ protagonist · blank verse · aside · soliloquy · dramatic irony · tragic hero · symbol · refrain · rhythm</span>
                <span>🔍 ${answeredCount} terms matched to stories</span>
            </div>
        `;

        container.innerHTML = mainHtml;
        const nextBtn = document.getElementById("nextBtnAction");
        if (nextBtn) nextBtn.addEventListener("click", goToNext);
        const resetMid = document.getElementById("resetMidQuiz");
        if (resetMid) resetMid.addEventListener("click", () => resetQuiz());
    }

    // initial shuffle and render
    initRandomizedOptions();
    renderCurrentQuestion();
</script>
</body>
</html>
