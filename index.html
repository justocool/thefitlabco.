<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Faith & Science Quiz | Disciples, Jesus, Prophecy, Evolution</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f5f2e8 0%, #e8e2d0 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            max-width: 850px;
            width: 100%;
            background: #fffef7;
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2), 0 5px 12px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 25px 28px 35px;
            transition: 0.2s;
        }
        h1 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 0.25rem;
            color: #2c3e2f;
            border-left: 8px solid #c49a6c;
            padding-left: 20px;
        }
        .sub {
            color: #5e5a4c;
            margin-bottom: 28px;
            font-style: italic;
            border-bottom: 1px solid #ddd8c8;
            padding-bottom: 12px;
        }
        .question-card {
            background: #fefaf2;
            border-radius: 32px;
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.03);
            border: 1px solid #e7dfcf;
        }
        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            color: #2c3e2f;
            margin-bottom: 20px;
            background: #fff2e0;
            padding: 12px 18px;
            border-radius: 60px;
            display: inline-block;
            width: auto;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #d6ccb2;
            border-radius: 60px;
            padding: 12px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: 0.1s linear;
            font-weight: 500;
            color: #2c3e2f;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .option-btn:hover {
            background: #f5efe2;
            border-color: #b28b5e;
            transform: scale(0.99);
        }
        .correct-feedback {
            background: #d4e6d1;
            border-left: 8px solid #2f6b2f;
            color: #1e4a1e;
            padding: 12px 18px;
            margin-top: 16px;
            border-radius: 28px;
            font-weight: 500;
        }
        .wrong-feedback {
            background: #ffe1de;
            border-left: 8px solid #bc5a4c;
            color: #8b2c1e;
            padding: 12px 18px;
            margin-top: 16px;
            border-radius: 28px;
        }
        .neutral-feedback {
            background: #f0efea;
            color: #6b5a3e;
            padding: 8px 18px;
            margin-top: 10px;
            border-radius: 28px;
            font-size: 0.9rem;
        }
        hr {
            margin: 20px 0;
            border-color: #e2d8c4;
        }
        .score-area {
            background: #2c3e2f;
            color: #fef5e6;
            padding: 15px 24px;
            border-radius: 100px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        button.reset-btn {
            background: #c49a6c;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            transition: 0.1s;
            margin-top: 10px;
            font-family: inherit;
        }
        button.reset-btn:hover {
            background: #a57c52;
            transform: scale(0.98);
        }
        footer {
            font-size: 0.75rem;
            text-align: center;
            color: #8f886c;
            margin-top: 30px;
        }
        @media (max-width: 550px) {
            .quiz-container { padding: 18px; }
            .question-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="quiz-container" id="quizApp">
    <h1>✝️ + 🔬 Quiz Challenge</h1>
    <div class="sub">Disciples • Jesus' life & death • Emmaus • Prophecies • Evolution & Worldviews</div>
    
    <div id="questionsArea"></div>
    
    <div class="score-area" id="scoreDisplay">Score: 0 / 0</div>
    <button class="reset-btn" id="resetQuizBtn">⟳ Restart Quiz</button>
    <footer>click any option → instant right/wrong feedback. no limits, learn as you go.</footer>
</div>

<script>
    // ---------- QUIZ DATA ----------
    const questions = [
        { // 1
            text: "Which disciple is known for denying Jesus three times before the rooster crowed?",
            options: ["Judas Iscariot", "Thomas", "Peter", "John"],
            correct: "Peter"
        },
        { // 2
            text: "What did Jesus say on the cross that is recorded as 'It is finished'? (tetelestai)",
            options: ["My God, my God, why have you forsaken me?", "Father forgive them", "Truly I say to you, today you will be with me in Paradise", "It is finished"],
            correct: "It is finished"
        },
        { // 3
            text: "On the road to Emmaus, who walked with the two disciples but was unrecognized at first?",
            options: ["An angel", "The Holy Spirit", "The risen Jesus", "Moses"],
            correct: "The risen Jesus"
        },
        { // 4
            text: "Which of these is a MARK of a TRUE prophet according to the Bible (Deuteronomy 18:22)?",
            options: ["Always performs miracles", "Speaks in poetry only", "Predictions come true 100%", "Is wealthy and powerful"],
            correct: "Predictions come true 100%"
        },
        { // 5
            text: "Fulfilled prophecy: 'He was pierced for our transgressions...' (Isaiah 53) points to which event in Jesus’ life?",
            options: ["His birth in Bethlehem", "His crucifixion / suffering", "His resurrection", "The Last Supper"],
            correct: "His crucifixion / suffering"
        },
        { // 6
            text: "According to the Gospels, which Old Testament prophet said the Messiah would be born in Bethlehem (Micah 5:2)?",
            options: ["Jeremiah", "Micah", "Zechariah", "Ezekiel"],
            correct: "Micah"
        },
        { // 7
            text: "Darwin’s theory of evolution by natural selection suggests that new species arise through...",
            options: ["sudden divine acts in one day", "gradual variation and differential survival", "inheritance of acquired traits only", "spontaneous generation every spring"],
            correct: "gradual variation and differential survival"
        },
        { // 8
            text: "The Cambrian Explosion refers to:",
            options: ["A massive asteroid impact killing dinosaurs", "The first appearance of flowering plants", "A rapid diversification of most major animal groups ~541 million years ago", "The moment oxygen first appeared in oceans"],
            correct: "A rapid diversification of most major animal groups ~541 million years ago"
        },
        { // 9
            text: "Which worldview holds that God created the universe and life in distinct, completed kinds, often within a recent timeframe?",
            options: ["Young-Earth Creationism", "Theistic evolution", "Deism", "Materialistic humanism"],
            correct: "Young-Earth Creationism"
        },
        { // 10
            text: "A Humanistic worldview (secular humanism) generally believes that:",
            options: ["Humans are created in God's image with a divine purpose", "Morality and meaning come from reason, science, and human flourishing without supernatural guidance", "Only the Bible provides absolute truth", "Karma decides your next life"],
            correct: "Morality and meaning come from reason, science, and human flourishing without supernatural guidance"
        },
        { // 11
            text: "Which disciple doubted Jesus' resurrection until he saw the nail marks?",
            options: ["Philip", "Bartholomew", "Thomas (Didymus)", "James the Less"],
            correct: "Thomas (Didymus)"
        },
        { // 12
            text: "Jesus’ death and resurrection was prophesied in Psalm 22, which includes: 'They pierced my hands and my feet.' This is a prophecy about:",
            options: ["King David's own death", "The suffering Messiah", "The destruction of the temple", "The flood of Noah"],
            correct: "The suffering Messiah"
        },
        { // 13
            text: "What happened to Jesus’ body according to the New Testament?",
            options: ["Remained in the tomb", "Stolen by disciples", "Resurrected on the third day", "Taken to Rome"],
            correct: "Resurrected on the third day"
        },
        { // 14
            text: "In the road to Emmaus account (Luke 24), after Jesus explained the Scriptures, how did the disciples recognize Him?",
            options: ["By His sandals", "When He gave a sign from heaven", "When He broke the bread and blessed it", "When the cloud lifted"],
            correct: "When He broke the bread and blessed it"
        },
        { // 15
            text: "The fossil record's 'Cambrian Explosion' is sometimes highlighted by creationists as evidence for:",
            options: ["Slow, imperceptible transitions", "Sudden appearance of complex life, consistent with creative acts", "Darwin's original predictions", "The earth being billions of years older"],
            correct: "Sudden appearance of complex life, consistent with creative acts"
        }
    ];

    // answer status: null = not answered, true = correct, false = wrong
    let answerStatus = new Array(questions.length).fill(null);
    let selectedAnswers = new Array(questions.length).fill(null);

    const questionsArea = document.getElementById("questionsArea");
    const scoreDisplay = document.getElementById("scoreDisplay");

    function updateScore() {
        let correctCount = 0;
        for (let i = 0; i < answerStatus.length; i++) {
            if (answerStatus[i] === true) correctCount++;
        }
        scoreDisplay.innerText = `Score: ${correctCount} / ${questions.length}`;
    }

    function saveAndRender() {
        renderQuestions();
        updateScore();
    }

    function handleAnswer(questionIdx, selectedOption) {
        const isCorrect = (selectedOption === questions[questionIdx].correct);
        answerStatus[questionIdx] = isCorrect;
        selectedAnswers[questionIdx] = selectedOption;
        saveAndRender();
    }

    function resetQuiz() {
        answerStatus.fill(null);
        selectedAnswers.fill(null);
        saveAndRender();
    }

    function renderQuestions() {
        let html = '';
        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            const userAnswer = selectedAnswers[i];
            const status = answerStatus[i]; // true / false / null
            let feedbackHtml = '';
            if (status !== null) {
                if (status === true) {
                    feedbackHtml = `<div class="correct-feedback">✅ Correct! ${q.correct} is right.</div>`;
                } else {
                    feedbackHtml = `<div class="wrong-feedback">❌ Wrong. Correct answer: <strong>${q.correct}</strong><br> <span style="font-size:0.9rem;">${getShortExplanation(i)}</span></div>`;
                }
            } else {
                feedbackHtml = `<div class="neutral-feedback">📌 Click an option above</div>`;
            }

            // generate clickable options
            let optionsHtml = '';
            for (let opt of q.options) {
                let extraClass = '';
                let disabledAttr = '';
                // No real disable, but we can show style if already answered? better to keep clickable but if already answered we let them change answer.
                // we allow re-answering (overwrites). That's fine.
                optionsHtml += `<button class="option-btn" data-qidx="${i}" data-opt="${opt.replace(/"/g, '&quot;')}">${opt}</button>`;
            }

            html += `
                <div class="question-card" data-qid="${i}">
                    <div class="question-text">${i+1}. ${q.text}</div>
                    <div class="options" id="options-${i}">
                        ${optionsHtml}
                    </div>
                    <div class="feedback-area" id="feedback-${i}">
                        ${feedbackHtml}
                    </div>
                </div>
            `;
        }
        questionsArea.innerHTML = html;

        // Attach event listeners dynamically
        for (let i = 0; i < questions.length; i++) {
            const optButtons = document.querySelectorAll(`.option-btn[data-qidx="${i}"]`);
            optButtons.forEach(btn => {
                btn.removeEventListener('click', clickHandler);
                btn.addEventListener('click', clickHandler);
            });
        }
    }

    function clickHandler(e) {
        const btn = e.currentTarget;
        const qidx = parseInt(btn.getAttribute('data-qidx'));
        const selected = btn.getAttribute('data-opt');
        handleAnswer(qidx, selected);
    }

    function getShortExplanation(idx) {
        const explanations = {
            0: "Peter denied Jesus three times (Luke 22:54-62).",
            1: "Jesus’ final word 'Tetelestai' means debt paid (John 19:30).",
            2: "Resurrected Jesus revealed Himself in Emmaus (Luke 24).",
            3: "Deut 18:22: 100% accurate prediction marks a true prophet.",
            4: "Isaiah 53 describes suffering servant crucified.",
            5: "Micah 5:2 – 'But you, Bethlehem Ephrathah...'",
            6: "Darwin's On the Origin of Species (1859) proposed natural selection.",
            7: "Most animal phyla appear suddenly in Cambrian strata.",
            8: "Young-earth creationists interpret Genesis literally, 6-day creation.",
            9: "Secular humanism = ethics without supernatural.",
            10: "Thomas insisted on touching wounds (John 20:24-29).",
            11: "Psalm 22:16 – they pierce my hands and feet.",
            12: "Jesus rose bodily on third day (1 Cor 15:4).",
            13: "Luke 24:30-31 – bread breaking opened their eyes.",
            14: "Creationists see Cambrian Explosion as evidence of intelligent design / sudden creation."
        };
        return explanations[idx] || "Review scripture / science notes.";
    }

    // initial render
    renderQuestions();
    updateScore();

    document.getElementById("resetQuizBtn").addEventListener("click", resetQuiz);
</script>
</body>
</html>
